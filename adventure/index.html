<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Can the New Country Survive?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Press+Start+2P&display=swap">
<style>
/* Layout: an arcade cabinet screen. Sticky HUD up top (meters + mastery), a pixel-art "window" beside a letterpress paper panel, a 1781→1787 timeline underneath. Single committed night-sky look. */
:root{
  --ink:#0b1426; --navy:#14213d; --navy2:#1f3360; --blue:#3d6fa3;
  --red:#b5352a; --red-d:#7f231b; --gold:#e8b43a; --cream:#f3e9d2; --paper:#fbf5e6;
  --text:#1b1a17; --muted:#5b5446; --ok:#2c6e40; --bad:#a3271d;
  --f-display:'Alfa Slab One', Rockwell, 'Roboto Slab', Georgia, serif;
  --f-pixel:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --f-body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--ink); color:var(--cream);
  font-family:var(--f-body); font-size:18px; line-height:1.55;
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(243,233,210,.55) 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 8%, rgba(243,233,210,.45) 50%, transparent 51%),
    radial-gradient(1px 1px at 38% 62%, rgba(243,233,210,.35) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 44%, rgba(243,233,210,.4) 50%, transparent 51%),
    radial-gradient(1px 1px at 55% 88%, rgba(243,233,210,.3) 50%, transparent 51%);
  background-size: 340px 340px;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);border-bottom:4px solid var(--ink)}
.hud-in{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.stripes{height:8px;background:repeating-linear-gradient(90deg,var(--red) 0 24px,var(--cream) 24px 48px)}
.logo{font-family:var(--f-pixel);font-size:11px;letter-spacing:.06em;color:var(--gold);white-space:nowrap}
.logo b{color:var(--cream);font-weight:400}
.meters{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.meter{display:flex;align-items:center;gap:7px}
.meter .lbl{font-family:var(--f-pixel);font-size:9px;letter-spacing:.08em}
.segs{display:flex;gap:2px}
.seg{width:11px;height:14px;border:2px solid var(--cream);background:transparent}
.meter[data-k=union] .seg.on{background:var(--cream)}
.meter[data-k=treasury] .seg.on{background:var(--gold)}
.meter[data-k=unrest] .seg.on{background:var(--red);border-color:#f0b0a8}
.meter .num{font-family:var(--f-pixel);font-size:9px;font-variant-numeric:tabular-nums;color:#c9c0aa}
.simtag{font-family:var(--f-pixel);font-size:8px;color:#9fa9c2;border:1px dashed #6b7898;padding:4px 6px;cursor:help;background:none}
.hud-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.xp{font-family:var(--f-pixel);font-size:10px;color:var(--gold);display:flex;align-items:center;gap:6px;white-space:nowrap}
.hbtn{font-family:var(--f-pixel);font-size:9px;letter-spacing:.05em;background:var(--ink);color:var(--cream);border:2px solid var(--cream);padding:9px 10px;min-height:36px}
.hbtn:hover{background:var(--navy2)}
.hbtn[aria-pressed=true]{background:var(--gold);color:var(--ink);border-color:var(--gold)}

/* ---------- Stage ---------- */
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 48px}
.screen{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start;animation:enter .35s steps(4) both}
@keyframes enter{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.art{position:sticky;top:96px;min-width:0}
.frame{position:relative;border:4px solid var(--cream);box-shadow:8px 8px 0 var(--red-d);background:var(--ink)}
.frame canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}
.frame::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px)}
.cap{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-family:var(--f-pixel);font-size:10px;letter-spacing:.06em;line-height:1.6}
.cap .yr{color:var(--gold)}
.cap .pl{color:#c9c0aa;text-align:right}
.toast{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.toast span{font-family:var(--f-pixel);font-size:10px;background:var(--ink);border:2px solid var(--gold);color:var(--gold);padding:6px 8px;animation:pop 2.4s steps(6) forwards}
.toast span.dn{border-color:#f0b0a8;color:#f0b0a8}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

.panel{min-width:0;background:var(--paper);color:var(--text);border:4px solid var(--ink);box-shadow:0 0 0 4px var(--cream),10px 10px 0 4px var(--red-d);padding:26px 26px 28px;display:flex;flex-direction:column;gap:16px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-family:var(--f-pixel);font-size:8px;letter-spacing:.08em;padding:5px 7px;border:2px solid var(--ink)}
.badge.doc{background:var(--gold);color:var(--ink)}
.badge.role{background:var(--blue);color:#fff}
.badge.sim{background:#e3ddd0;color:var(--ink);border-style:dashed}
.badge.int{background:var(--red);color:#fff}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.7rem,3.2vw,2.35rem);line-height:1.05;margin:0;color:var(--navy);text-wrap:balance;outline:none}
.body p{margin:0 0 .7em;max-width:62ch}
.body p:last-child{margin-bottom:0}
.body strong{color:var(--red-d)}
.term{background:none;border:none;padding:0;font:inherit;color:var(--navy);text-decoration:underline dotted 2px;text-underline-offset:3px;font-weight:700;cursor:help}
.term:hover{color:var(--red)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-pixel);font-size:9px;letter-spacing:.05em;background:var(--cream);color:var(--ink);border:2px solid var(--ink);padding:9px 10px;min-height:38px;box-shadow:3px 3px 0 var(--ink)}
.chip:hover{background:#fff}
.chip.src{background:var(--gold)}
.chip.done::after{content:" ✓"}
.chip:active{transform:translate(3px,3px);box-shadow:none}

.choices{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;background:var(--navy);color:var(--cream);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:12px 16px;min-height:56px;font-weight:700;font-size:17px;line-height:1.3;transition:background .1s}
.choice .k{flex:none;font-family:var(--f-pixel);font-size:11px;width:30px;height:30px;display:grid;place-items:center;background:var(--gold);color:var(--ink);border:2px solid var(--ink)}
.choice:hover{background:var(--blue)}
.choice:active{transform:translate(5px,5px);box-shadow:none}
.choice[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.choice.right{background:var(--ok);opacity:1}
.choice.wrong{background:var(--bad);opacity:1}
.choice.go{background:var(--red)}
.choice.go:hover{background:#cc4335}
.q{font-weight:700;font-size:18px;margin:0;color:var(--navy)}
.fb{border:3px solid var(--ink);padding:12px 14px;background:#fff;font-size:16.5px}
.fb b{font-family:var(--f-pixel);font-size:10px;letter-spacing:.06em;display:block;margin-bottom:6px}
.fb.ok b{color:var(--ok)} .fb.no b{color:var(--bad)}
.note{font-size:14.5px;color:var(--muted);margin:0}

.banner{margin:-26px -26px 0;padding:14px 22px;background:var(--red);color:#fff;border-bottom:4px solid var(--ink);display:flex;flex-direction:column;gap:6px}
.banner .t{font-family:var(--f-pixel);font-size:13px;letter-spacing:.08em}
.banner .s{font-size:15px;font-weight:700}
.banner.hz{background:repeating-linear-gradient(-45deg,var(--red) 0 16px,var(--red-d) 16px 32px)}
.banner.hz .t,.banner.hz .s{text-shadow:2px 2px 0 var(--ink)}

/* sort + chain */
.sortrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:2px solid var(--ink);padding:10px 12px;background:#fff}
.sortrow .txt{font-size:16px;font-weight:700;min-width:0}
.seg2{display:flex;gap:6px}
.seg2 button{font-family:var(--f-pixel);font-size:8px;letter-spacing:.04em;padding:10px 8px;border:2px solid var(--ink);background:var(--cream);color:var(--ink);min-height:40px}
.seg2 button[aria-pressed=true]{background:var(--navy);color:var(--cream)}
.sortrow.right{border-color:var(--ok);box-shadow:inset 6px 0 0 var(--ok)}
.sortrow.wrong{border-color:var(--bad);box-shadow:inset 6px 0 0 var(--bad)}
.mark{font-family:var(--f-pixel);font-size:8px;display:block;margin-top:4px}
.sortrow.right .mark{color:var(--ok)} .sortrow.wrong .mark{color:var(--bad)}
.step{border:3px solid var(--ink);background:#fff;padding:14px;display:flex;flex-direction:column;gap:8px}
.step h3{margin:0;font-family:var(--f-pixel);font-size:10px;letter-spacing:.06em;color:var(--red-d)}
.step p{margin:0;font-weight:700}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid var(--ink);background:var(--cream);padding:10px 12px;min-height:48px;font-size:16px;line-height:1.35}
.opt[aria-pressed=true]{background:var(--navy);color:var(--cream)}
.opt .dot{flex:none;width:14px;height:14px;border:2px solid currentColor;margin-top:3px}
.opt[aria-pressed=true] .dot{background:var(--gold)}
.arrow{font-family:var(--f-pixel);text-align:center;color:var(--red);font-size:14px}

/* ---------- Title ---------- */
.title{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:36px;align-items:center;padding-block:10px 20px;animation:enter .4s steps(4) both}
.kicker{font-family:var(--f-pixel);font-size:11px;letter-spacing:.1em;color:var(--gold);margin:0 0 18px;line-height:1.8}
.title h1{font-family:var(--f-display);font-weight:400;margin:0;line-height:.92;font-size:clamp(2.8rem,7.4vw,6.4rem);letter-spacing:.005em;color:var(--cream);text-shadow:4px 4px 0 var(--red),8px 8px 0 var(--ink);text-wrap:balance}
.title h1 em{font-style:normal;color:var(--gold);display:block}
.sub{font-size:20px;max-width:46ch;margin:22px 0 26px;color:#e6dcc4}
.start{font-family:var(--f-pixel);font-size:15px;letter-spacing:.08em;background:var(--red);color:#fff;border:4px solid var(--cream);box-shadow:8px 8px 0 var(--ink),8px 8px 0 4px var(--cream);padding:20px 26px;min-height:64px}
.start:hover{background:#cc4335}
.start:active{transform:translate(6px,6px);box-shadow:2px 2px 0 var(--ink)}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.start-row{display:flex;flex-wrap:wrap;gap:16px 18px;align-items:center}
.ghost{font-family:var(--f-pixel);font-size:10px;letter-spacing:.06em;background:transparent;color:var(--cream);border:3px solid var(--cream);padding:14px 14px;min-height:52px}
.ghost:hover{background:var(--navy2)}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:40px}
.rule{border-top:4px solid var(--gold);padding-top:12px}
.rule h3{font-family:var(--f-pixel);font-size:10px;letter-spacing:.08em;color:var(--gold);margin:0 0 8px;line-height:1.6}
.rule p{margin:0;font-size:16px;color:#ddd3bb}

/* ---------- Roles ---------- */
.rolehead{text-align:left;margin-bottom:22px}
.rolehead h2{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,4.6vw,3.4rem);margin:0;line-height:1;color:var(--cream);text-shadow:3px 3px 0 var(--red);outline:none}
.rolehead p{max-width:64ch;color:#ddd3bb;margin:12px 0 0}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.rolecard{display:flex;flex-direction:column;text-align:left;background:var(--paper);color:var(--text);border:4px solid var(--ink);box-shadow:0 0 0 4px var(--cream),8px 8px 0 4px var(--blue);padding:0;overflow:hidden}
.rolecard:hover{box-shadow:0 0 0 4px var(--gold),8px 8px 0 4px var(--red)}
.rolecard canvas{width:100%;aspect-ratio:16/9;image-rendering:pixelated;display:block;border-bottom:4px solid var(--ink)}
.rolecard .in{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.rolecard .nm{font-family:var(--f-display);font-size:1.5rem;line-height:1.05;color:var(--navy)}
.rolecard .rq{font-style:italic;font-size:16px}
.rolecard .tag{font-family:var(--f-pixel);font-size:8px;letter-spacing:.06em;color:var(--red-d)}
.rolecard .rec{align-self:flex-start;font-family:var(--f-pixel);font-size:8px;background:var(--gold);border:2px solid var(--ink);padding:5px 7px}
.rolecard .pick{margin-top:auto;font-family:var(--f-pixel);font-size:10px;background:var(--navy);color:var(--cream);padding:12px;text-align:center;border:3px solid var(--ink)}

/* ---------- Timeline ---------- */
.tl{margin-top:34px;display:flex;flex-direction:column;gap:8px}
.tl-bar{position:relative;height:18px;border:3px solid var(--cream);background:var(--ink)}
.tl-fill{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--red) 0 10px,var(--cream) 10px 20px);transition:width .4s steps(6)}
.tl-yrs{display:flex;justify-content:space-between;font-family:var(--f-pixel);font-size:9px;color:#b8b09c}
.tl-lbl{font-family:var(--f-pixel);font-size:9px;color:var(--gold);letter-spacing:.06em}

/* ---------- End ---------- */
.finale{border:4px solid var(--cream);background:var(--navy);box-shadow:10px 10px 0 var(--red-d);padding:clamp(22px,4vw,48px);margin-bottom:34px}
.finale .y{font-family:var(--f-display);font-size:clamp(3rem,10vw,7rem);line-height:.9;color:var(--gold);text-shadow:5px 5px 0 var(--red)}
.finale p{font-size:clamp(1.15rem,2.4vw,1.6rem);max-width:40ch;margin:16px 0 0;line-height:1.35}
.finale .big{font-family:var(--f-display);font-size:clamp(1.8rem,4.4vw,3rem);color:var(--cream);line-height:1.05;margin-top:22px;text-shadow:3px 3px 0 var(--red)}
.report{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.rank{font-family:var(--f-pixel);font-size:clamp(14px,2.4vw,20px);line-height:1.5;color:var(--red-d)}
.score{font-family:var(--f-display);font-size:4rem;line-height:1;color:var(--navy)}
.score small{font-size:1.6rem;color:var(--muted)}
table.sc{width:100%;border-collapse:collapse;font-size:15.5px}
table.sc td{border-bottom:2px dotted #c7bca3;padding:7px 4px;vertical-align:top}
table.sc td:last-child{text-align:right;font-family:var(--f-pixel);font-size:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.panel label{font-family:var(--f-pixel);font-size:9px;letter-spacing:.06em;color:var(--navy)}
.panel input,.panel textarea{width:100%;font:inherit;font-size:16px;border:3px solid var(--ink);background:#fff;color:var(--text);padding:10px 12px}
.panel textarea{min-height:130px;resize:vertical}
.debrief{border:3px solid var(--ink);padding:14px;background:var(--cream)}
.debrief p{margin:0 0 8px;font-size:16px}
pre.rep{white-space:pre-wrap;font-size:13px;background:#fff;border:2px dashed var(--ink);padding:12px;max-height:240px;overflow:auto;margin:0}

/* ---------- Modal / popover ---------- */
dialog{border:4px solid var(--ink);box-shadow:0 0 0 4px var(--cream),12px 12px 0 4px var(--red-d);background:var(--paper);color:var(--text);padding:0;width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(11,20,38,.78)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--navy);color:var(--cream);padding:12px 16px;position:sticky;top:0}
.mhead h3{font-family:var(--f-pixel);font-size:11px;letter-spacing:.06em;margin:0;line-height:1.6}
.mx{font-family:var(--f-pixel);font-size:10px;background:var(--red);color:#fff;border:2px solid var(--cream);padding:8px 10px;min-height:36px}
.mbody{padding:20px 22px 24px;display:flex;flex-direction:column;gap:14px}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:15.5px;margin:0}
.meta dt{font-family:var(--f-pixel);font-size:9px;letter-spacing:.06em;color:var(--red-d);padding-top:4px}
.meta dd{margin:0}
blockquote{margin:0;border-left:6px solid var(--gold);background:#fff;padding:14px 16px;font-family:Georgia,'Times New Roman',serif;font-size:18px;line-height:1.5}
blockquote.sum{font-family:var(--f-body);font-size:16.5px}
.mbody a{color:var(--navy);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{border:3px solid var(--ink);background:#fff;padding:10px 12px;font-size:15px}
.card b{display:block;font-family:var(--f-pixel);font-size:9px;letter-spacing:.05em;color:var(--red-d);margin-bottom:6px;line-height:1.5}
.card.locked{background:#e8e2d4;color:#7a7262;border-style:dashed}
.gl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:15px;margin:0}
.gl dt{font-weight:700;color:var(--navy)}
.gl dd{margin:0}
.tg{width:100%;border-collapse:collapse;font-size:15px}
.tg td{border-bottom:2px dotted #c7bca3;padding:6px 4px;vertical-align:top}
.tg td:first-child{font-weight:700;white-space:nowrap;padding-right:12px}
.pop{position:fixed;z-index:50;max-width:min(320px,calc(100vw - 32px));background:var(--ink);color:var(--cream);border:3px solid var(--gold);padding:12px 14px;font-size:15px;box-shadow:6px 6px 0 var(--red-d)}
.pop b{display:block;font-family:var(--f-pixel);font-size:9px;letter-spacing:.06em;color:var(--gold);margin-bottom:6px;line-height:1.5}
.foot{margin-top:40px;font-size:13.5px;color:#9fa9c2;max-width:80ch}

@media (max-width:900px){
  .screen,.title,.report{grid-template-columns:minmax(0,1fr)}
  .art{position:static}
  .roles,.rules{grid-template-columns:minmax(0,1fr)}
  .cards{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  body{font-size:17px}
  .panel{padding:20px 18px 22px}
  .banner{margin:-20px -18px 0}
  .sortrow{grid-template-columns:minmax(0,1fr)}
  .hud-right{margin-left:0}
  .simtag{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<header class="hud" id="hud">
  <div class="hud-in">
    <div class="logo">★ NEW COUNTRY <b>1781–87</b></div>
    <div class="meters" id="meters" hidden></div>
    <div class="hud-right">
      <div class="xp" id="xp" hidden></div>
      <button class="hbtn" id="nbBtn" type="button">NOTEBOOK</button>
      <button class="hbtn" id="sndBtn" type="button" aria-pressed="false">SOUND OFF</button>
    </div>
  </div>
  <div class="stripes"></div>
</header>

<main class="wrap" id="stage" aria-live="off"></main>
<div class="sr" id="live" aria-live="polite"></div>

<dialog id="modal" aria-labelledby="mTitle">
  <div class="mhead"><h3 id="mTitle">SOURCE</h3><button class="mx" type="button" id="mClose">CLOSE ✕</button></div>
  <div class="mbody" id="mBody"></div>
</dialog>

<script>
/* =========================================================
   DATA: glossary, notebook cards, sources
   ========================================================= */
const GLOSS={
  articles:['Articles of Confederation','The first constitution of the United States. It joined the states in a confederation while leaving the states very powerful.'],

const N={
C0:{p:3,year:'MARCH 1781',place:'THE THIRTEEN STATES',scene:'title',badges:['doc'],title:'The New Government',
 body:`The Revolutionary War is still underway, but the thirteen states have finally approved a plan for governing together: the [[Articles of Confederation|articles]].\n\nAmericans remember what it felt like to be ruled by a distant government. Their new system keeps **most power close to the states**. Your choices will test what happens when that system faces pressure.`,
 choices:[{l:'Begin the mission',to:'C1',go:1}]},
C1:{p:7,year:'1781',place:'THE CHARTER',scene:'charter',badges:['doc'],title:'Why Build It This Way?',src:['art2'],card:'sovereignty',
 body:`Under the Articles, each state keeps its [[sovereignty]], freedom and independence. Congress handles shared problems like war, diplomacy and western lands, but **there is no separate national president**, and Congress depends on the states for money and enforcement.\n\nThis was not an accident. It was designed by people who feared concentrating too much power in one national government.`,
 choices:[{l:'Continue to the Power Check',to:'C2'}]},
C2:{p:11,year:'1781–1786',place:'POWER CHECK',scene:'congress',badges:['doc'],kind:'cfu',title:'Power Check: Who Pays?',src:['art8'],
 body:`Before you enter the story, make one prediction. Congress needs money to pay national expenses, but several states don’t send what Congress requests.\n\nThis is a **knowledge check**, not a personality choice. It won’t change your character’s fate, and you can earn full mastery after feedback and retries.`,
 cfu:{key:'c2',pts:1,q:'Which statement best fits the Articles?',next:'C3',card:'requisition',flag:'learned_requisition',opts:[
  {l:'Congress directly taxes citizens.',to:'D-C2'},
  {l:'Congress depends on the states to supply the treasury.',ok:1,fb:'Right. Article VIII: the common treasury is “supplied by the several states,” and state legislatures lay the taxes. Congress could only make a [[requisition]].'},
  {l:'A national president orders the states to pay.',to:'D-C2'}]}},
'D-C2':{p:11,year:'1781–1786',place:'POWER CHECK',scene:'stop',kind:'deadend',label:'POWER CHECK',title:'That Move Doesn’t Fit the Articles',
 body:`Congress cannot simply impose a general national [[tax]] on individuals, and there is **no national president** who can order states to pay. The common [[treasury]] depends on supplies from the states.\n\nNo game over here. Go back and choose the option that matches the document.`,
 choices:[{l:'Return to the question',to:'C2',go:1}]},
C3:{p:15,year:'1781–1787',place:'CONFEDERATION CONGRESS',scene:'congress',badges:['doc'],title:'Not Powerless',src:['nwo'],card:'notpowerless',
 body:`The Articles created real national institutions, not “no government.” Congress conducted diplomacy, handled war and peace, managed western territory, and later passed the **Northwest Ordinance**.\n\nBut big actions needed broad state agreement, and to [[amend]] the Articles every state [[legislature]] had to agree. The problem isn’t that Congress can do nothing. It’s that some powers are hard to use when states disagree.`,
 choices:[{l:'Choose your perspective',to:'R0',go:1}]},
R0:{p:20,kind:'roles'},

/* ---------- FARMER / VETERAN ---------- */
F1:{p:26,year:'1783',place:'WESTERN MASSACHUSETTS',scene:'farm',badges:['role','doc'],title:'Home From War',
 body:`You are a fictional Revolutionary War veteran back on a small farm. Peace has not made life easy. You owe private [[debt|debt]]s, taxes are due, and hard money is scarce.\n\nNeighbors say courts can order property sold when debts go unpaid. You believed independence would protect ordinary citizens. Now you wonder what **liberty** means when your farm is at risk.`,
 choices:[{l:'Pay my taxes first, even if my debts grow',to:'F2',set:{farmer_first:'pay'}},{l:'Join neighbors preparing a petition',to:'F2',set:{farmer_first:'petition'}},{l:'Find out whether Congress can help',to:'F2',set:{farmer_first:'congress'}}]},
F2:{p:32,year:'1786',place:'HAMPSHIRE COUNTY, MASS.',scene:'farm',badges:['role'],title:'Which Government?',
 body:`By 1786 the pressure is worse. Massachusetts needs revenue to pay its public debts, while rural families struggle with taxes and private debts.\n\nOne neighbor says, “Congress should just cancel these state taxes.” Another says the problem belongs in **Boston**, not Congress. Where do you direct your anger?`,
 choices:[{l:'Petition the Massachusetts legislature',to:'F3',set:{jurisdiction:'state'}},{l:'Ask Congress to cancel the Massachusetts taxes',to:'D-F2',retry:1},{l:'Organize with neighbors in my town',to:'F3',set:{jurisdiction:'local'}}]},
'D-F2':{p:32,year:'1786',place:'JURISDICTION CHECK',scene:'stop',kind:'deadend',label:'JURISDICTION CHECK',title:'Wrong Government',
 body:`Congress cannot erase a tax passed by Massachusetts. Your character’s hardship is real, but **the tax policy comes from the state government**.\n\nThis distinction matters: Shays’ Rebellion grew from Massachusetts grievances, while weaknesses in the Articles shaped the larger national picture. Go back and aim at the government that controls this tax.`,
 choices:[{l:'Return to the decision',to:'F2',go:1}]},
F3:{p:38,year:'AUGUST 1786',place:'NORTHAMPTON COURT',scene:'court',badges:['role','doc'],title:'Court Day',
 body:`A county court is about to open. Farmers gather outside because court judgments can lead to debt collection and [[foreclosure]].\n\nSome want to petition peacefully. Others want to stop the court from meeting at all. You recognize men who served in the Revolution. Their argument is powerful: how can a republic be legitimate if people believe it ignores their suffering?`,
 choices:[{l:'Join the peaceful petition',to:'F4',set:{protest:'petition'}},{l:'Help stop the court from sitting',to:'F4',set:{protest:'court_block'},fx:{unrest:1}},{l:'Go home',to:'F4',set:{protest:'withdraw'}}]},
F4:{p:44,year:'FALL 1786',place:'WESTERN MASSACHUSETTS',scene:'court',badges:['role','sim'],title:'Consequences',
 body:s=>({petition:'You stood with the petitioners. ',court_block:'You helped keep the court from sitting. ',withdraw:'You went home. '}[s.flags.protest]||'')+`Petitions keep channels open but guarantee nothing. Blocking a court delays lawsuits but challenges the state’s authority. Staying home avoids arrest, yet the debt crisis doesn’t disappear.\n\nThe movement is organizing across western Massachusetts. You hear the name **Daniel Shays**, a former Continental Army captain, more often.`,
 choices:[{l:'Keep pushing for peaceful reform',to:'F5'},{l:'Join the armed organizers',to:'F5',fx:{unrest:1}},{l:'Step back from the movement',to:'F5'}]},
F5:{p:50,year:'LATE 1786',place:'WESTERN MASSACHUSETTS',scene:'arsenal',badges:['role'],title:'A Line to Cross',
 body:`Armed groups are now part of the confrontation. You’re asked to join men preparing to move toward **Springfield**, where weapons are stored at the federal [[arsenal]].\n\nThis is not a “good person / bad person” test. The game records your strategy, then returns you to what actually happened.`,
 choices:[{l:'March toward Springfield',to:'F6',set:{final:'armed'},fx:{unrest:1}},{l:'Refuse arms, keep demanding reform',to:'F6',set:{final:'nonviolent'}},{l:'Withdraw completely',to:'F6',set:{final:'withdraw'}}]},
F6:{p:56,year:'JANUARY 1787',place:'NEAR SPRINGFIELD',scene:'arsenal',badges:['doc'],title:'Toward Springfield',crisis:1,
 body:`The march on the Springfield arsenal has become the turning point. Whatever you chose, Daniel Shays and other insurgents approach the arsenal. Its weapons could strengthen their movement, but state [[militia]] forces are waiting.\n\nThe screen pauses before the clash. Next is a **History Check**: from here on, player choices can’t change the outcome.`,
 choices:[{l:'See what actually happened',to:'H1',go:1}]},

/* ---------- STATE LEADER ---------- */
S1:{p:26,year:'1786',place:'BOSTON',scene:'statehouse',badges:['role','doc'],title:'The Treasury Problem',
 body:`You are a fictional member of the Massachusetts [[legislature]]. The state owes heavy Revolutionary War debts and needs revenue. Creditors expect payment, but rural residents say taxes and court costs are crushing them.\n\nLower taxes ease hardship but cut revenue. Strict collection steadies the budget but deepens anger. Choose your first response.`,
 choices:[{l:'Favor tax relief',to:'S2',set:{fiscal:'relief'},fx:{unrest:-1}},{l:'Defend current collection',to:'S2',set:{fiscal:'strict'},fx:{unrest:1}},{l:'Seek a compromise',to:'S2',set:{fiscal:'mixed'}}]},
S2:{p:32,year:'SUMMER 1786',place:'BOSTON',scene:'statehouse',badges:['role','sim'],title:'Petitions Arrive',
 body:`Petitions and county conventions report grievances from western towns. Some demand tax relief and lower court costs. Others warn that government can’t function if people refuse lawful payments.\n\nThe Unrest meter tracks simulated pressure. **It does not grade your morality.** Your reasoning matters more than a “good-looking” meter.`,
 choices:[{l:'Support immediate relief',to:'S3',fx:{unrest:-1}},{l:'Keep the existing fiscal program',to:'S3',fx:{unrest:1}},{l:'Offer a mixed response',to:'S3'}]},
S3:{p:38,year:'FALL 1786',place:'BOSTON',scene:'court',badges:['role','doc'],title:'Courts Are Closing',
 body:`News arrives that protesters have surrounded courts and stopped proceedings. Courts are part of **state** government, so this challenges state authority.\n\nOne colleague wants to ask the Confederation Congress to cancel Massachusetts taxes. Another wants [[militia]] forces now. A third wants negotiation plus limited relief.`,
 choices:[{l:'Ask Congress to cancel Massachusetts taxes',to:'D-S3',retry:1},{l:'Prepare the militia',to:'S4',set:{response:'force'},fx:{unrest:1}},{l:'Negotiate and offer limited relief',to:'S4',set:{response:'mixed'}}]},
'D-S3':{p:38,year:'FALL 1786',place:'AUTHORITY CHECK',scene:'stop',kind:'deadend',label:'AUTHORITY CHECK',title:'This One Is Yours',
 body:`You are responsible for a Massachusetts crisis. The Confederation Congress **cannot cancel your state’s taxes or take over its courts**.\n\nAsking Congress for cooperation is possible. Handing your state’s tax decisions to Congress is not. Go back and choose with state authority in mind.`,
 choices:[{l:'Return to the decision',to:'S3',go:1}]},
S4:{p:44,year:'WINTER 1786',place:'BOSTON',scene:'statehouse',badges:['role','doc'],title:'Order and Legitimacy',
 body:`History keeps moving. Massachusetts officials treat the court closures and armed organizing as a serious threat. The state prepares military force while arguments continue over taxes, debt and representation.\n\nTroops and supplies cost money. That exposes the difference between **a state acting inside its own borders** and Congress trying to gather national resources.`,
 choices:[{l:'Prioritize force',to:'S5'},{l:'Seek negotiation',to:'S5'},{l:'Prepare force, keep talks open',to:'S5'}]},
S5:{p:50,year:'JANUARY 1787',place:'BOSTON',scene:'statehouse',badges:['role','sim'],title:'How Do You Respond?',
 body:`The confrontation is moving toward Springfield. Choose your priority: deterrence through armed force, negotiation and concessions, or a mixed strategy. **None guarantees peace.**\n\nYour choice moves the Unrest meter one point in the simulation. It does not rewrite what happened.`,
 choices:[{l:'Force',to:'S6',set:{response:'force'},fx:{unrest:1}},{l:'Negotiation',to:'S6',set:{response:'negotiation'},fx:{unrest:-1}},{l:'Mixed strategy',to:'S6',set:{response:'mixed'}}]},
S6:{p:56,year:'JANUARY 1787',place:'SPRINGFIELD',scene:'arsenal',badges:['doc'],title:'Defend the Arsenal',crisis:1,
 body:`State [[militia]] forces are positioned to defend the federal [[arsenal]] at Springfield. Massachusetts can act through its own government, yet national leaders are watching what the Confederation can and can’t do.\n\nThe simulation stops before the clash. The next screen fixes the historical outcome.`,
 choices:[{l:'See what actually happened',to:'H1',go:1}]},

/* ---------- CONFEDERATION CONGRESS ---------- */
G1:{p:26,year:'1785',place:'CONGRESS · NEW YORK CITY',scene:'congress',badges:['role','doc'],title:'Congress Asks',
 body:`You represent one state, and **each state has one vote**. National expenses remain, but the common [[treasury]] depends on money supplied by the states, and some send less than Congress requests.\n\nSoldiers, creditors and foreign governments still expect to be paid. What do you try first?`,
 choices:[{l:'Request state contributions again',to:'G2',set:{strategy:'requisition'},fx:{treasury:1}},{l:'Propose changing the system',to:'G2',set:{strategy:'reform'}},{l:'Delay and hope it resolves',to:'G2',set:{strategy:'dismiss'},fx:{treasury:-1}}]},
G2:{p:32,year:'1786',place:'CONGRESS · NEW YORK CITY',scene:'congress',badges:['role','doc'],title:'Just Tax Them?',src:['art8','art13'],
 body:`A delegate proposes a simple fix: “Let Congress collect a national tax directly.”\n\nIt sounds efficient, but the Articles give Congress **no independent general taxing power**. Shared costs are supplied through the states, and changing the Articles requires [[unanimous]] approval of the state legislatures. One option below hits a constitutional wall.`,
 choices:[{l:'Pass a national tax anyway',to:'D-G2',set:{direct_tax:true},retry:1},{l:'Seek an amendment',to:'G3',card:'unanimity'},{l:'Keep requisitioning the states',to:'G3',set:{learned_requisition:true}}]},
'D-G2':{p:32,year:'1786',place:'CONSTITUTIONAL CHECK',scene:'stop',kind:'deadend',label:'CONSTITUTIONAL DEAD END',title:'A Vote Isn’t a Power',
 body:`Your tax bill can’t become a valid national tax just because Congress votes for it. Under the Articles, shared expenses are supplied **through the states**. To change the Articles themselves, **every** state legislature must agree.\n\nYou’ve found the difference between wanting a policy and having the legal authority to enact it.`,
 choices:[{l:'Return and choose a real option',to:'G2',go:1}],card:'unanimity'},
G3:{p:38,year:'SEPTEMBER 1786',place:'ANNAPOLIS, MARYLAND',scene:'congress',badges:['role','doc'],title:'Reform Before Rebellion',
 body:`Money isn’t the only problem. States chase their own trade interests, and Congress lacks the broad commerce power the Constitution would later grant.\n\nDelegates meet at **Annapolis** to discuss trade and call for a broader [[convention]]. Note the timeline: pressure to revise the Confederation exists **before** Shays’ Rebellion reaches its climax.`,
 choices:[{l:'Support a broader convention',to:'G4',set:{reform:true}},{l:'Wait and see',to:'G4'},{l:'Oppose expanding national power',to:'G4',set:{reform:false}}]},
G4:{p:44,year:'FALL 1786',place:'CONGRESS · NEW YORK CITY',scene:'congress',badges:['role','sim'],title:'News From Massachusetts',
 body:`Reports describe courts being closed and armed resistance spreading. Congress can discuss national security and call on the states, but **dependable money and troops are hard to assemble**.\n\nYour choice sets a simulation flag. It cannot create powers the Articles don’t grant.`,
 choices:[{l:'Request support from the states',to:'G5',fx:{union:1}},{l:'Push harder for structural reform',to:'G5',set:{strategy:'reform'}},{l:'Treat it as Massachusetts’s problem',to:'G5',fx:{union:-1}}]},
G5:{p:50,year:'WINTER 1786',place:'CONGRESS · NEW YORK CITY',scene:'congress',badges:['doc'],kind:'cfu',title:'Power vs. Capacity',
 body:`The Springfield crisis sharpens the question. **Being allowed to act is not the same as having money, troops and compliance.**\n\nAvoid the shortcut “Congress could do nothing.” The more accurate lesson is about capacity.`,
 cfu:{key:'g5',pts:0,q:'Which statement is most accurate?',next:'G6',opts:[
  {l:'Congress legally did not exist.',fb:'Congress existed and held real powers over war, diplomacy and western lands.'},
  {l:'Congress had real powers but depended heavily on state resources.',ok:1,fb:'Yes. Congress could authorize, request and coordinate, but money and troops mostly came through the states.'},
  {l:'A national president commanded the response.',fb:'The Articles created no national president.'}]}},
G6:{p:56,year:'JANUARY 1787',place:'CONGRESS · NEW YORK CITY',scene:'arsenal',badges:['doc'],title:'Springfield News',crisis:1,
 body:`News reaches Congress that insurgents are moving toward the federal [[arsenal]] at Springfield. Local grievances, armed resistance, public debt and doubts about the Confederation have collided.\n\nYour path now merges with the farmer and state leader paths. The next screen fixes the historical outcome.`,
 choices:[{l:'See what actually happened',to:'H1',go:1}]},

/* ---------- HISTORY CONVERGENCE ---------- */
H1:{p:62,year:'1786–1787',place:'HISTORY CHECK',scene:'check',badges:['doc'],kind:'cfu',check:1,title:'What Actually Caused It?',card:'jurisdiction',
 body:`Shays’ Rebellion was not caused simply by “the Articles being weak.” Its direct causes were in **Massachusetts**: heavy taxation, [[debt]], court costs, scarce money and postwar hardship.\n\nThe Articles matter because they shaped the national system and the response to the crisis. Keep two arrows in mind:\n**Massachusetts grievances → rebellion.**\n**Confederation weaknesses + rebellion → stronger arguments for reform.**`,
 cfu:{key:'h1',pts:2,q:'Which explanation is strongest?',next:'H2',opts:[
  {l:'The Articles directly created the Massachusetts tax crisis.',fb:'Massachusetts, not Congress, set those taxes. The Articles shaped the national context, not the state tax bill.'},
  {l:'Massachusetts grievances drove the rebellion; Confederation weaknesses shaped why it mattered nationally.',ok:1,fb:'Exactly. Two different causal questions, two different answers.'},
  {l:'Britain secretly ordered the rebellion.',fb:'No evidence supports this. The grievances were local: taxes, debt, courts and scarce money.'}]}},
H2:{p:68,year:'JANUARY 25, 1787',place:'SPRINGFIELD ARSENAL',scene:'arsenal',badges:['doc'],check:1,title:'Springfield',card:'springfield',
 body:`On **January 25, 1787**, Daniel Shays and other insurgents approached the federal arsenal at Springfield. Massachusetts militia defended it and fired on the advancing force. The attempt failed.\n\nThe rebellion did not overthrow Massachusetts, and state forces soon broke organized resistance. No player could “win” this battle. The real question is what Americans **concluded** from it.`,
 choices:[{l:'Hear two reactions',to:'H3',go:1}]},
H3:{p:74,year:'1786–1787',place:'SOURCE LENS',scene:'letters',badges:['int','doc'],kind:'cfu',needSrc:['knox','jefferson'],title:'Two Americans, Two Reactions',card:'reactions',
 body:`Americans did not agree on what the rebellion meant. **Henry Knox** warned George Washington that the uprising revealed deep danger. **Thomas Jefferson**, writing from France, was far less alarmed.\n\nOpen both letters. Your job is to identify each author’s view, not to decide which man was automatically “right.”`,
 cfu:{key:'h3',pts:1,q:'Who treats the rebellion as stronger evidence that government is in danger?',next:'H4',opts:[
  {l:'Henry Knox',ok:1,fb:'Yes. Knox reads the uprising as proof of weak government and a threat to property. That is his interpretation, shaped by where he stood.'},
  {l:'Thomas Jefferson',fb:'Look again. Jefferson calls “a little rebellion now and then” a good thing.'},
  {l:'Both were equally alarmed',fb:'Compare their tone. One sounds an alarm; the other shrugs from across the ocean.'}]}},
H4:{p:80,year:'1786',place:'HISTORY CHECK',scene:'check',badges:['doc'],kind:'cfu',check:1,src:['jay'],title:'Shays Was Not the Beginning',card:'timeline',
 body:`Calls to revise the Articles did **not** begin after Shays’ Rebellion. John Jay wrote to Washington in **March 1786** that support was growing for a general convention, and the Annapolis Convention met in **September 1786**.\n\nShays’ Rebellion intensified the debate and became powerful evidence for advocates of stronger government. It was one part of a larger reform movement.`,
 cfu:{key:'h4',pts:1,q:'Shays’ Rebellion is best described as…',next:'H5',opts:[
  {l:'The sole cause of the movement for a new constitution.',fb:'Check the dates. Jay’s letter and Annapolis came first.'},
  {l:'An accelerator and evidence within a reform movement already underway.',ok:1,fb:'Right. It added urgency and ammunition to an existing argument.'},
  {l:'Unrelated to the debate over the Articles.',fb:'Leaders like Knox and Washington used it as evidence. It mattered.'}]}},
H5:{p:86,year:'MAY–SEPT. 1787',place:'PHILADELPHIA',scene:'philly',badges:['doc'],kind:'sort',check:1,src:['const'],title:'What Changes?',card:'article1',
 body:`Delegates arrive in Philadelphia to address defects in the Confederation. They soon move beyond repairs and debate a new structure.\n\nSort each power: does it describe the **Articles** or the **Constitution**?`},
H6:{p:92,year:'1787',place:'FINAL CHALLENGE',scene:'check',badges:['doc'],kind:'chain',title:'Final Causal Challenge',
 body:`Build the causal chain **without** using the sentence “The Articles caused Shays’ Rebellion.” Pick one link for each step.\n\nYour score comes from this reasoning and your evidence checks, not from whether you chose protest, compromise, force or caution in the role-play.`},
'D-H6':{p:92,year:'1787',place:'CAUSALITY CHECK',scene:'stop',kind:'deadend',label:'CAUSALITY CHECK',title:'Rebuild the Chain',
 body:`Try again without turning one event into a single-cause story.\n\n**Start** with conditions inside Massachusetts: taxes, debt, court costs, hardship. **Then** add the Confederation’s national limits. **Finally**, explain the political effect: the rebellion strengthened arguments for reform, even though reform efforts had already begun.`,
 choices:[{l:'Return to the final challenge',to:'H6',go:1}]},
H7:{p:97,year:'1787',place:'A CONTESTED NEW DIRECTION',scene:'philly',badges:['doc','int'],title:'The Argument Isn’t Over',

  if(S.role==='farmer'){

    const a={force:'You leaned on armed force to restore order.',negotiation:'You leaned on negotiation and concessions.',mixed:'You prepared force while keeping talks open.'}[f.response]||'You governed Massachusetts through the crisis.';
    const b={relief:' You started out favoring tax relief.',strict:' You started out defending strict collection.',mixed:' You started out seeking compromise.'}[f.fiscal]||'';
    return a+b+' Either way, you saw that this was a state crisis handled by a state government, while national leaders watched what the Confederation could and couldn’t do.';
  }
  const a=f.reform===true?'You backed a broader convention before news from Springfield arrived. That matters: Americans were already debating reform before Shays’ Rebellion became a national symbol.':f.reform===false?'You opposed expanding national power. Plenty of Americans agreed with you, and they would keep making that case in 1787 and 1788.':'You waited to see how reform would unfold.';
  return a+(f.direct_tax?' You also tried to pass a national tax and ran into Article VIII and Article XIII.':'');
}
function reportText(name,ticket){
  const sc=total();
  return `CAN THE NEW COUNTRY SURVIVE? — MISSION REPORT
Name: ${name||'(not entered)'}
Role: ${ROLE_NAME[S.role]||'—'}
Mastery: ${sc}/10 · ${rankOf(sc)}
${ASSESS.map(([k,l,m])=>`  - ${l}: ${S.score[k]||0}/${m}`).join('\n')}
Corrections visited: ${S.retries}
Final meters (simulation only): Union ${S.m.union}/5 · Treasury ${S.m.treasury}/5 · Unrest ${S.m.unrest}/5
Path: ${pathEcho()}

EXIT TICKET — What problem did the Constitution attempt to solve, and what new problem might stronger national power create?
${ticket||'(no answer yet)'}`;
}
function renderEnd(st){
  anim=null;
  const sc=total();
  st.appendChild(el('section','finale',`<div class="y">1787</div>
    <p>The Articles were created by Americans who feared concentrated power. Now many Americans fear something different: a national government too weak to solve shared problems.</p>
    <p>But giving the national government more power creates a new question.</p>
    <div class="big">How powerful should it become?</div>
    <p style="color:var(--gold);font-family:var(--f-pixel);font-size:11px;line-height:1.8;margin-top:22px">THAT ARGUMENT IS ABOUT TO TAKE OVER PHILADELPHIA.</p>`));
  const rep=el('div','report');
  const left=el('article','panel');
  left.innerHTML=`<div class="badges"><span class="badge doc">MISSION REPORT</span><span class="badge role">${esc((ROLE_NAME[S.role]||'').toUpperCase())}</span></div>
   <h2 tabindex="-1">Your Results</h2>
   <div><div class="score">${sc}<small>/10</small></div><div class="rank">${rankOf(sc)}</div></div>
   <table class="sc"><tbody>${ASSESS.map(([k,l,m])=>`<tr><td>${esc(l)}</td><td>${S.score[k]||0}/${m}</td></tr>`).join('')}</tbody></table>
   <p class="note">Mastery reflects your best demonstrated understanding. Retries do not reduce your score. Corrections visited: ${S.retries}. Meters are simulation only and never affect your grade: Union ${S.m.union}/5 · Treasury ${S.m.treasury}/5 · Unrest ${S.m.unrest}/5.</p>
   <div class="fb"><b>YOUR PATH</b>${esc(pathEcho())}</div>`;
  const right=el('article','panel');
  right.innerHTML=`<div class="debrief"><p><strong>Debrief: which statement is more accurate, and why?</strong></p>
     <p><strong>A.</strong> “The Articles of Confederation caused Shays’ Rebellion.”</p>
     <p style="margin:0"><strong>B.</strong> “Massachusetts’s economic and political crisis caused the rebellion, while weaknesses in the Confederation shaped its national significance and strengthened an existing reform movement.”</p></div>
   <label for="nm">YOUR NAME</label><input id="nm" type="text" autocomplete="name" value="${esc(S.flags.name||'')}">
   <label for="tk">EXIT TICKET · What problem did the Constitution attempt to solve, and what new problem might stronger national power create?</label>
   <textarea id="tk">${esc(S.flags.ticket||'')}</textarea>
   <div class="choices">
     <button class="choice go" type="button" id="cpBtn"><span class="k">⧉</span><span>Copy my report</span></button>
   </div>
   <pre class="rep" id="repTxt" hidden></pre>
   <div class="tools"><button class="chip" type="button" id="againBtn">PLAY ANOTHER ROLE</button><button class="chip" type="button" id="resetBtn">RESTART FROM TITLE</button></div>`;
  rep.appendChild(left);rep.appendChild(right);st.appendChild(rep);
  const nm=$('#nm'),tk=$('#tk');
  const upd=()=>{S.flags.name=nm.value;S.flags.ticket=tk.value;save()};nm.oninput=upd;tk.oninput=upd;
  $('#cpBtn').onclick=e=>{
    const txt=reportText(nm.value,tk.value);const pre=$('#repTxt');pre.textContent=txt;pre.hidden=false;
    const lab=e.currentTarget.querySelector('span:last-child');
    const sel=()=>{const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);lab.textContent='Selected. Press Ctrl/Cmd+C to copy'};
    try{navigator.clipboard.writeText(txt).then(()=>{lab.textContent='Copied! Paste it where your teacher asks';beep('good')},sel)}catch(err){sel()}
  };
  $('#againBtn').onclick=()=>{const keep={score:{c2:S.score.c2||0},first:{c2:S.first.c2},cards:S.cards.filter(c=>['sovereignty','requisition','notpowerless'].includes(c)),flags:{solved_c2:1,name:S.flags.name||'',ticket:S.flags.ticket||''}};S=Object.assign(fresh(),keep);if(!S.score.c2)delete S.score.c2;go('R0')};
  $('#resetBtn').onclick=()=>{S=fresh();clearSave();render()};
  $('h2',left).focus({preventScroll:true});
}

/* keyboard: 1–4 pick choices */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closePop();
  if(modal.open||/INPUT|TEXTAREA/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-4]$/.test(e.key)){const b=document.querySelector(`#stage [data-i="${e.key}"]:not([disabled])`);if(b){e.preventDefault();b.click()}}
});

/* boot */
function start(data){
  if(data&&data.node){S=Object.assign(fresh(),data)}
  render();
}
start();
</script>

<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Can the New Country Survive?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Press+Start+2P&display=swap">
<style>
/* Layout: an arcade cabinet screen. Sticky HUD up top (meters + mastery), a pixel-art "window" beside a letterpress paper panel, a 1781→1787 timeline underneath. Single committed night-sky look. */
:root{
  --ink:#0b1426; --navy:#14213d; --navy2:#1f3360; --blue:#3d6fa3;
  --red:#b5352a; --red-d:#7f231b; --gold:#e8b43a; --cream:#f3e9d2; --paper:#fbf5e6;
  --text:#1b1a17; --sage:#3f6f55; --muted:#5b5446; --ok:#2c6e40; --bad:#a3271d;
  --f-display:'Alfa Slab One', Rockwell, 'Roboto Slab', Georgia, serif;
  --f-pixel:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --f-body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--ink); color:var(--cream);
  font-family:var(--f-body); font-size:18px; line-height:1.55;
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(243,233,210,.55) 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 8%, rgba(243,233,210,.45) 50%, transparent 51%),
    radial-gradient(1px 1px at 38% 62%, rgba(243,233,210,.35) 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 44%, rgba(243,233,210,.4) 50%, transparent 51%),
    radial-gradient(1px 1px at 55% 88%, rgba(243,233,210,.3) 50%, transparent 51%);
  background-size: 340px 340px;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);border-bottom:4px solid var(--ink)}
.hud-in{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px}
.stripes{height:8px;background:repeating-linear-gradient(90deg,var(--red) 0 24px,var(--cream) 24px 48px)}
.logo{font-family:var(--f-pixel);font-size:11px;letter-spacing:.06em;color:var(--gold);white-space:nowrap}
.logo b{color:var(--cream);font-weight:400}
.meters{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.meter{display:flex;align-items:center;gap:7px}
.meter .lbl{font-family:var(--f-pixel);font-size:9px;letter-spacing:.08em}
.segs{display:flex;gap:2px}
.seg{width:11px;height:14px;border:2px solid var(--cream);background:transparent}
.meter[data-k=hope] .seg.on{background:var(--gold)}
.meter[data-k=trust] .seg.on{background:var(--cream)}
.meter[data-k=tension] .seg.on{background:var(--red);border-color:#f0b0a8}
.meter .num{font-family:var(--f-pixel);font-size:9px;font-variant-numeric:tabular-nums;color:#c9c0aa}
.simtag{font-family:var(--f-pixel);font-size:8px;color:#9fa9c2;border:1px dashed #6b7898;padding:4px 6px;cursor:help;background:none}
.hud-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.xp{font-family:var(--f-pixel);font-size:10px;color:var(--gold);display:flex;align-items:center;gap:6px;white-space:nowrap}
.hbtn{font-family:var(--f-pixel);font-size:9px;letter-spacing:.05em;background:var(--ink);color:var(--cream);border:2px solid var(--cream);padding:9px 10px;min-height:36px}
.hbtn:hover{background:var(--navy2)}
.hbtn[aria-pressed=true]{background:var(--gold);color:var(--ink);border-color:var(--gold)}

/* ---------- Stage ---------- */
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 48px}
.screen{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start;animation:enter .35s steps(4) both}
@keyframes enter{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.art{position:sticky;top:96px;min-width:0}
.frame{position:relative;border:4px solid var(--cream);box-shadow:8px 8px 0 var(--red-d);background:var(--ink)}
.frame canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}
.frame::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px)}
.cap{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-family:var(--f-pixel);font-size:10px;letter-spacing:.06em;line-height:1.6}
.cap .yr{color:var(--gold)}
.cap .pl{color:#c9c0aa;text-align:right}
.toast{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:2}
.toast span{font-family:var(--f-pixel);font-size:10px;background:var(--ink);border:2px solid var(--gold);color:var(--gold);padding:6px 8px;animation:pop 2.4s steps(6) forwards}
.toast span.dn{border-color:#f0b0a8;color:#f0b0a8}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

.panel{min-width:0;background:var(--paper);color:var(--text);border:4px solid var(--ink);box-shadow:0 0 0 4px var(--cream),10px 10px 0 4px var(--red-d);padding:26px 26px 28px;display:flex;flex-direction:column;gap:16px}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-family:var(--f-pixel);font-size:8px;letter-spacing:.08em;padding:5px 7px;border:2px solid var(--ink)}
.badge.doc{background:var(--gold);color:var(--ink)}
.badge.role{background:var(--blue);color:#fff}
.badge.sim{background:#e3ddd0;color:var(--ink);border-style:dashed}
.badge.int{background:var(--red);color:#fff}
.badge.sel{background:var(--sage);color:#fff}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.7rem,3.2vw,2.35rem);line-height:1.05;margin:0;color:var(--navy);text-wrap:balance;outline:none}
.body p{margin:0 0 .7em;max-width:62ch}
.body p:last-child{margin-bottom:0}
.body strong{color:var(--red-d)}
.term{background:none;border:none;padding:0;font:inherit;color:var(--navy);text-decoration:underline dotted 2px;text-underline-offset:3px;font-weight:700;cursor:help}
.term:hover{color:var(--red)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-pixel);font-size:9px;letter-spacing:.05em;background:var(--cream);color:var(--ink);border:2px solid var(--ink);padding:9px 10px;min-height:38px;box-shadow:3px 3px 0 var(--ink)}
.chip:hover{background:#fff}
.chip.src{background:var(--gold)}
.chip.done::after{content:" ✓"}
.chip:active{transform:translate(3px,3px);box-shadow:none}

.choices{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.choice{display:flex;align-items:center;gap:14px;text-align:left;background:var(--navy);color:var(--cream);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:12px 16px;min-height:56px;font-weight:700;font-size:17px;line-height:1.3;transition:background .1s}
.choice .k{flex:none;font-family:var(--f-pixel);font-size:11px;width:30px;height:30px;display:grid;place-items:center;background:var(--gold);color:var(--ink);border:2px solid var(--ink)}
.choice:hover{background:var(--blue)}
.choice:active{transform:translate(5px,5px);box-shadow:none}
.choice[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.choice.right{background:var(--ok);opacity:1}
.choice.wrong{background:var(--bad);opacity:1}
.choice.go{background:var(--red)}
.choice.go:hover{background:#cc4335}
.q{font-weight:700;font-size:18px;margin:0;color:var(--navy)}
.fb{border:3px solid var(--ink);padding:12px 14px;background:#fff;font-size:16.5px}
.fb b{font-family:var(--f-pixel);font-size:10px;letter-spacing:.06em;display:block;margin-bottom:6px}
.fb.ok b{color:var(--ok)} .fb.no b{color:var(--bad)}
.note{font-size:14.5px;color:var(--muted);margin:0}

.banner{margin:-26px -26px 0;padding:14px 22px;background:var(--red);color:#fff;border-bottom:4px solid var(--ink);display:flex;flex-direction:column;gap:6px}
.banner .t{font-family:var(--f-pixel);font-size:13px;letter-spacing:.08em}
.banner .s{font-size:15px;font-weight:700}
.banner.hz{background:repeating-linear-gradient(-45deg,var(--red) 0 16px,var(--red-d) 16px 32px)}
.banner.hz .t,.banner.hz .s{text-shadow:2px 2px 0 var(--ink)}

/* sort + chain */
.sortrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:2px solid var(--ink);padding:10px 12px;background:#fff}
.sortrow .txt{font-size:16px;font-weight:700;min-width:0}
.seg2{display:flex;gap:6px}
.seg2 button{font-family:var(--f-pixel);font-size:8px;letter-spacing:.04em;padding:10px 8px;border:2px solid var(--ink);background:var(--cream);color:var(--ink);min-height:40px}
.seg2 button[aria-pressed=true]{background:var(--navy);color:var(--cream)}
.sortrow.right{border-color:var(--ok);box-shadow:inset 6px 0 0 var(--ok)}
.sortrow.wrong{border-color:var(--bad);box-shadow:inset 6px 0 0 var(--bad)}
.mark{font-family:var(--f-pixel);font-size:8px;display:block;margin-top:4px}
.sortrow.right .mark{color:var(--ok)} .sortrow.wrong .mark{color:var(--bad)}
.step{border:3px solid var(--ink);background:#fff;padding:14px;display:flex;flex-direction:column;gap:8px}
.step h3{margin:0;font-family:var(--f-pixel);font-size:10px;letter-spacing:.06em;color:var(--red-d)}
.step p{margin:0;font-weight:700}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid var(--ink);background:var(--cream);padding:10px 12px;min-height:48px;font-size:16px;line-height:1.35}
.opt[aria-pressed=true]{background:var(--navy);color:var(--cream)}
.opt .dot{flex:none;width:14px;height:14px;border:2px solid currentColor;margin-top:3px}
.opt[aria-pressed=true] .dot{background:var(--gold)}
.arrow{font-family:var(--f-pixel);text-align:center;color:var(--red);font-size:14px}

/* ---------- Title ---------- */
.title{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:36px;align-items:center;padding-block:10px 20px;animation:enter .4s steps(4) both}
.kicker{font-family:var(--f-pixel);font-size:11px;letter-spacing:.1em;color:var(--gold);margin:0 0 18px;line-height:1.8}
.title h1{font-family:var(--f-display);font-weight:400;margin:0;line-height:.92;font-size:clamp(2.8rem,7.4vw,6.4rem);letter-spacing:.005em;color:var(--cream);text-shadow:4px 4px 0 var(--red),8px 8px 0 var(--ink);text-wrap:balance}
.title h1 em{font-style:normal;color:var(--gold);display:block}
.sub{font-size:20px;max-width:46ch;margin:22px 0 26px;color:#e6dcc4}
.start{font-family:var(--f-pixel);font-size:15px;letter-spacing:.08em;background:var(--red);color:#fff;border:4px solid var(--cream);box-shadow:8px 8px 0 var(--ink),8px 8px 0 4px var(--cream);padding:20px 26px;min-height:64px}
.start:hover{background:#cc4335}
.start:active{transform:translate(6px,6px);box-shadow:2px 2px 0 var(--ink)}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.start-row{display:flex;flex-wrap:wrap;gap:16px 18px;align-items:center}
.ghost{font-family:var(--f-pixel);font-size:10px;letter-spacing:.06em;background:transparent;color:var(--cream);border:3px solid var(--cream);padding:14px 14px;min-height:52px}
.ghost:hover{background:var(--navy2)}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:40px}
.rule{border-top:4px solid var(--gold);padding-top:12px}
.rule h3{font-family:var(--f-pixel);font-size:10px;letter-spacing:.08em;color:var(--gold);margin:0 0 8px;line-height:1.6}
.rule p{margin:0;font-size:16px;color:#ddd3bb}

/* ---------- Roles ---------- */
.rolehead{text-align:left;margin-bottom:22px}
.rolehead h2{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,4.6vw,3.4rem);margin:0;line-height:1;color:var(--cream);text-shadow:3px 3px 0 var(--red);outline:none}
.rolehead p{max-width:64ch;color:#ddd3bb;margin:12px 0 0}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.rolecard{display:flex;flex-direction:column;text-align:left;background:var(--paper);color:var(--text);border:4px solid var(--ink);box-shadow:0 0 0 4px var(--cream),8px 8px 0 4px var(--blue);padding:0;overflow:hidden}
.rolecard:hover{box-shadow:0 0 0 4px var(--gold),8px 8px 0 4px var(--red)}
.rolecard canvas{width:100%;aspect-ratio:16/9;image-rendering:pixelated;display:block;border-bottom:4px solid var(--ink)}
.rolecard .in{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.rolecard .nm{font-family:var(--f-display);font-size:1.5rem;line-height:1.05;color:var(--navy)}
.rolecard .rq{font-style:italic;font-size:16px}
.rolecard .tag{font-family:var(--f-pixel);font-size:8px;letter-spacing:.06em;color:var(--red-d)}
.rolecard .rec{align-self:flex-start;font-family:var(--f-pixel);font-size:8px;background:var(--gold);border:2px solid var(--ink);padding:5px 7px}
.rolecard .pick{margin-top:auto;font-family:var(--f-pixel);font-size:10px;background:var(--navy);color:var(--cream);padding:12px;text-align:center;border:3px solid var(--ink)}

/* ---------- Timeline ---------- */
.tl{margin-top:34px;display:flex;flex-direction:column;gap:8px}
.tl-bar{position:relative;height:18px;border:3px solid var(--cream);background:var(--ink)}
.tl-fill{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--red) 0 10px,var(--cream) 10px 20px);transition:width .4s steps(6)}
.tl-yrs{display:flex;justify-content:space-between;font-family:var(--f-pixel);font-size:9px;color:#b8b09c}
.tl-lbl{font-family:var(--f-pixel);font-size:9px;color:var(--gold);letter-spacing:.06em}

/* ---------- End ---------- */
.finale{border:4px solid var(--cream);background:var(--navy);box-shadow:10px 10px 0 var(--red-d);padding:clamp(22px,4vw,48px);margin-bottom:34px}
.finale .y{font-family:var(--f-display);font-size:clamp(3rem,10vw,7rem);line-height:.9;color:var(--gold);text-shadow:5px 5px 0 var(--red)}
.finale p{font-size:clamp(1.15rem,2.4vw,1.6rem);max-width:40ch;margin:16px 0 0;line-height:1.35}
.finale .big{font-family:var(--f-display);font-size:clamp(1.8rem,4.4vw,3rem);color:var(--cream);line-height:1.05;margin-top:22px;text-shadow:3px 3px 0 var(--red)}
.report{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.rank{font-family:var(--f-pixel);font-size:clamp(14px,2.4vw,20px);line-height:1.5;color:var(--red-d)}
.score{font-family:var(--f-display);font-size:4rem;line-height:1;color:var(--navy)}
.score small{font-size:1.6rem;color:var(--muted)}
table.sc{width:100%;border-collapse:collapse;font-size:15.5px}
table.sc td{border-bottom:2px dotted #c7bca3;padding:7px 4px;vertical-align:top}
table.sc td:last-child{text-align:right;font-family:var(--f-pixel);font-size:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.panel label{font-family:var(--f-pixel);font-size:9px;letter-spacing:.06em;color:var(--navy)}
.panel input,.panel textarea{width:100%;font:inherit;font-size:16px;border:3px solid var(--ink);background:#fff;color:var(--text);padding:10px 12px}
.panel textarea{min-height:130px;resize:vertical}
.debrief{border:3px solid var(--ink);padding:14px;background:var(--cream)}
.debrief p{margin:0 0 8px;font-size:16px}
pre.rep{white-space:pre-wrap;font-size:13px;background:#fff;border:2px dashed var(--ink);padding:12px;max-height:240px;overflow:auto;margin:0}

/* ---------- SEL: feelings, values, journal, people ---------- */
.feelgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ftile{display:flex;flex-direction:column;align-items:center;gap:8px;border:3px solid var(--ink);background:var(--cream);padding:12px 6px 10px;box-shadow:4px 4px 0 var(--ink);font-family:var(--f-pixel);font-size:8px;letter-spacing:.05em;color:var(--ink);min-height:44px}
.ftile canvas{width:44px;height:44px;image-rendering:pixelated;display:block}
.ftile:hover{background:#fff}
.ftile[aria-pressed=true]{background:var(--sage);color:#fff}
.ftile:active{transform:translate(4px,4px);box-shadow:none}
.under{border:3px solid var(--sage);background:#eef4ef;padding:12px 14px;font-size:16.5px}
.under b{display:block;font-family:var(--f-pixel);font-size:9px;letter-spacing:.06em;color:var(--sage);margin-bottom:6px;line-height:1.5}
.valgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.vtile{font-family:var(--f-pixel);font-size:8px;letter-spacing:.04em;line-height:1.5;border:3px solid var(--ink);background:var(--cream);color:var(--ink);padding:12px 6px;min-height:52px;box-shadow:3px 3px 0 var(--ink)}
.vtile[aria-pressed=true]{background:var(--navy);color:var(--gold)}
.vtile[disabled]{opacity:.4}
.think{border:3px dashed var(--navy);background:#fff;padding:12px 14px;font-size:16.5px}
.think b{display:block;font-family:var(--f-pixel);font-size:9px;letter-spacing:.06em;color:var(--navy);margin-bottom:6px}
.panel .jr{min-height:150px;font-family:Georgia,'Times New Roman',serif;font-size:17px;line-height:1.6;background:repeating-linear-gradient(#fff 0 26px,#e7dfcc 26px 27px);padding-top:4px}
.chk{display:flex;gap:10px;align-items:center;font-size:15.5px}
.chk input{width:22px;height:22px;flex:none}
.row{display:flex;flex-wrap:wrap;gap:10px}
.dossier{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:start}
.dossier canvas{width:132px;height:132px;image-rendering:pixelated;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--red-d);display:block}
.dossier .cls{font-family:var(--f-pixel);font-size:9px;color:var(--red-d);letter-spacing:.05em;line-height:1.6;margin:0 0 4px}
.dossier .nm{font-family:var(--f-display);font-size:1.9rem;line-height:1;color:var(--navy);margin:0}
.dossier .lf{font-family:var(--f-pixel);font-size:9px;color:var(--muted);margin:6px 0 0}
.stats{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:15.5px}
.stats dt{font-family:var(--f-pixel);font-size:8px;letter-spacing:.05em;color:var(--sage);padding-top:5px}
.stats dd{margin:0}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pbtn{display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid var(--ink);background:#fff;padding:10px 6px;font-family:var(--f-pixel);font-size:8px;line-height:1.5;color:var(--ink);text-align:center}
.pbtn canvas{width:64px;height:64px;image-rendering:pixelated}
.pbtn[disabled]{background:#e8e2d4;color:#7a7262;border-style:dashed;cursor:default}
.journey{display:flex;flex-wrap:wrap;gap:8px}
.jchip{display:flex;align-items:center;gap:6px;border:2px solid var(--ink);background:#fff;padding:4px 8px 4px 4px;font-size:13.5px}
.jchip canvas{width:28px;height:28px;image-rendering:pixelated}
.jchip b{font-family:var(--f-pixel);font-size:8px}
.sech{font-family:var(--f-pixel);font-size:10px;letter-spacing:.06em;color:var(--navy);margin:8px 0 0}
@media (max-width:520px){.feelgrid,.valgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.dossier{grid-template-columns:minmax(0,1fr)}.people{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- Modal / popover ---------- */
dialog{border:4px solid var(--ink);box-shadow:0 0 0 4px var(--cream),12px 12px 0 4px var(--red-d);background:var(--paper);color:var(--text);padding:0;width:min(680px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(11,20,38,.78)}

 choices:[{l:'Be honest with Ruth, without scaring her',to:'F4',set:{kids:'truth'},fx:{trust:1}},{l:'Keep the worry to myself',to:'F4',set:{kids:'hide'},fx:{hope:-1}},{l:'Say “We’ll ask the neighbors for help”',to:'F4',set:{kids:'help'},fx:{hope:1}}]},
F4:{p:39,year:'AUGUST 29, 1786',place:'NORTHAMPTON COURTHOUSE',scene:'court',badges:['role','doc'],title:'Court Day',
 body:"Farmers crowd the Northampton courthouse. Many fought in the Revolution. They call themselves [[Regulators|regulators]] because they believe they're setting a broken government right.\n\nIn this role-play, you spot **Daniel Shays**, the officer who sold his sword. Some people want to petition. Others want to stop the court from hearing cases. You're standing among neighbors—and a decision you can't avoid.",
 choices:[{l:'Join the peaceful petition',to:'F5',set:{protest:'petition'}},{l:'Help stop the court from sitting',to:'F5',set:{protest:'court_block'},fx:{tension:1,hope:1}},{l:'Go home to my family',to:'F5',set:{protest:'withdraw'},fx:{hope:-1}}]},
F5:{p:43,year:'FALL 1786',place:'THE ROAD HOME',scene:'farm',badges:['role','rs'],title:'Your Neighbor Asa',
 body:s=>({petition:'You chose to petition. Other Regulators still prevented the Northampton court from sitting. ',court_block:'You joined the crowd that kept the Northampton court from sitting. ',withdraw:'You went home. Other Regulators still prevented the Northampton court from sitting. '}[s.flags.protest]||'')+"**Asa Porter**, your fictional neighbor, lives a mile down the road. You helped plow his field when he broke his arm. Now he's joined the county militia.\n\n“If the courts close again,” he tells you, “I might be ordered to stop you.” He's still your neighbor, but you may end up on opposite sides. What do you say?",
 choices:[{l:'Hear Asa out before I respond',to:'F6',set:{talk:'listen'},fx:{trust:1,tension:-1}},{l:'Tell Asa he’s letting his neighbors down',to:'F6',set:{talk:'argue'},fx:{tension:1}},{l:'Walk away without a word',to:'F6',set:{talk:'walk'},fx:{hope:-1}}]},
F6:{p:47,year:'JANUARY 1787',place:'WESTERN MASSACHUSETTS',scene:'arsenal',badges:['role','dm'],kind:'values',title:'Stop. Think. Choose.',
 body:s=>talkEcho.farmer[s.flags.talk]+"Armed Regulators are preparing to march on the federal [[arsenal]] at Springfield. Before you decide whether to go, slow down. Who could be affected—Hannah, Ruth, Asa, the people you served with?\n\n**Choose two values** that matter most to your character. This doesn't tell you which choice is right. It helps you explain why you'd make it.",next:'F7'},
F7:{p:51,year:'JANUARY 1787',place:'WESTERN MASSACHUSETTS',scene:'arsenal',badges:['role'],title:'A Line to Cross',
 body:s=>valEcho(s)+"Men are gathering muskets. You can march with them, keep pushing for reform without taking up arms, or step back from the movement. Every option comes with a cost.\n\nThere's no “good person / bad person” score here. Your choice shapes your character's experience. The **History Check** will show what happened, regardless of which path you choose.",
 choices:[{l:'March toward Springfield',to:'F8',set:{final:'armed'},fx:{tension:1}},{l:'Refuse arms, keep demanding reform',to:'F8',set:{final:'nonviolent'}},{l:'Step away for my family',to:'F8',set:{final:'withdraw'},fx:{hope:-1}}]},
F8:{p:55,year:'JANUARY 24, 1787',place:'BY CANDLELIGHT',scene:'kitchen',badges:['role','sa'],kind:'journal',title:'A Letter to Hannah',
 body:"It's the night before Springfield, and sleep isn't happening. Whatever you decided, you keep thinking about Hannah and the kids.\n\nIn this fictional scene, you put your thoughts on paper. You don't need a perfect speech. Tell Hannah what you're choosing, what worries you, and what you hope she understands.",
 prompt:'Write 2–4 sentences to Hannah as your character. What do you want her to know?',next:'F9'},
F9:{p:58,year:'JANUARY 25, 1787',place:'NEAR SPRINGFIELD',scene:'arsenal',badges:['doc'],title:'Toward Springfield',crisis:1,
 body:"Snow covers the road. Whatever you chose for your character, Daniel Shays and other Regulators approach Springfield's arsenal. Its weapons could strengthen their movement. State [[militia]] forces are waiting to defend it.\n\nThe role-play pauses before the clash. Next comes a **History Check**: your choices can change your perspective, but they can't change the documented outcome.",
 choices:[{l:'See what actually happened',to:'H1',go:1}]},

/* ---------- STATE LEADER ---------- */
S1:{p:24,year:'1786',place:'BOSTON',scene:'statehouse',badges:['role','doc'],title:'The Treasury Problem',
 body:"You're a fictional member of the Massachusetts [[legislature]], and the budget is a problem you can't put off. The state owes war debts. Its [[creditor]]s expect payment in coin.\n\nRural families say taxes and court costs are pushing them over the edge. Cut taxes, and revenue falls. Collect aggressively, and anger grows. How do you start handling that tradeoff?",
 choices:[{l:'Favor tax relief',to:'S2',set:{fiscal:'relief'},fx:{tension:-1,hope:1}},{l:'Defend current collection',to:'S2',set:{fiscal:'strict'},fx:{tension:1}},{l:'Seek a compromise',to:'S2',set:{fiscal:'mixed'}}]},
S2:{p:28,year:'SUMMER 1786',place:'BOSTON',scene:'charter',badges:['role','so'],title:'The Widow’s Petition',
 body:"A widow's petition lands on your desk. Her husband died in the war, and the tax collector took her only cow. She's asking for **more time to pay**, not a handout.\n\nShe's fictional, but struggling families really did petition the legislature. Many demands went unanswered. Meanwhile, the state's lenders want their money. Whose needs do you address first?",
 choices:[{l:'Push for relief for families like hers',to:'S2F',set:{petition:'relief'},fx:{tension:-1,trust:1}},{l:'Keep the current program',to:'S2F',set:{petition:'strict'},fx:{tension:1,trust:-1}},{l:'Offer extra time, but no tax cut',to:'S2F',set:{petition:'mixed'}}]},
S2F:{p:31,year:'SUMMER 1786',place:'BOSTON',scene:'charter',badges:['role','sa'],kind:'feel',title:'Reading Her Petition',
 body:"You set the petition down, but it stays with you. It's one thing to debate revenue. It's another to picture the family behind the bill.\n\nWhat is your character feeling? Name it without grading it. Then think about how that feeling might influence your next decision—and what else you still need to consider.",
 prompt:'As you set down her petition, what does your character feel?',next:'S3'},
S3:{p:35,year:'FALL 1786',place:'BOSTON',scene:'court',badges:['role','doc'],title:'Courts Are Closing',
 body:"Reports arrive: armed [[Regulators|regulators]] have surrounded courts and stopped proceedings. These are **state** courts, so the challenge lands on your government's desk.\n\nOne colleague wants Congress to cancel Massachusetts taxes. Another wants the [[militia]] ready immediately. A third wants talks and limited relief. What can your government actually do—and what are you prepared to try?",
 choices:[{l:'Ask Congress to cancel Massachusetts taxes',to:'D-S3',retry:1},{l:'Prepare the militia',to:'S4',set:{response:'force'},fx:{tension:1}},{l:'Negotiate and offer limited relief',to:'S4',set:{response:'mixed'}}]},
'D-S3':{p:35,year:'FALL 1786',place:'AUTHORITY CHECK',scene:'stop',kind:'deadend',label:'AUTHORITY CHECK',title:'This One Is Yours',
 body:"This problem is on Massachusetts's desk. Congress **can't cancel your state's taxes or take over its courts**.\n\nYou can ask for cooperation on shared concerns. You can't hand Congress a state power it doesn't possess. Head back and choose a response that fits the authority your government actually has.",
 choices:[{l:'Return to the decision',to:'S3',go:1}]},
S4:{p:39,year:'NOVEMBER 1786',place:'THE STATE HOUSE',scene:'statehouse',badges:['role','rs'],title:'Your Colleague’s Brother',
 body:"Your fictional colleague, **Representative Lyman**, pulls you aside. His younger brother joined the Regulators. “He's not trying to destroy the country,” Lyman says. “He's drowning in debt.”\n\nThe governor wants a firm response. Lyman wants you to see a person, not just a threat. Hearing him out doesn't settle the policy question—but how do you respond to him?",
 choices:[{l:'Hear Lyman out. Ask about his brother.',to:'S5',set:{talk:'listen'},fx:{trust:1,tension:-1}},{l:'Say the law has to apply to everyone',to:'S5',set:{talk:'argue'},fx:{tension:1}},{l:'Change the subject',to:'S5',set:{talk:'walk'},fx:{trust:-1}}]},
S5:{p:43,year:'NOVEMBER 1786',place:'BOSTON',scene:'statehouse',badges:['role','doc','dm'],kind:'values',title:'Stop. Think. Choose.',
 body:s=>talkEcho.state[s.flags.talk]+"Another development: **Prince Hall**, a leader in Boston's free Black community, has offered to raise volunteers to defend the state. Governor Bowdoin declines.\n\nThe crisis doesn't split everyone neatly into the same two camps. Before your next decision, **choose two values** your character wants to uphold. What will you protect, and what might your choice put at risk?",next:'S6',people:['hall']},
S6:{p:47,year:'JANUARY 1787',place:'BOSTON',scene:'statehouse',badges:['role','sim'],title:'How Do You Respond?',
 body:s=>valEcho(s)+"The Regulators are heading toward Springfield. You can prioritize armed force, negotiations and concessions, or a combination. **None guarantees peace.**\n\nMake the case for your approach. Your choice affects the simulation's Hope, Trust, and Tension indicators—not your academic score. At the History Check, you'll see what Massachusetts officials and the Regulators actually did.",
 choices:[{l:'Force',to:'S7',set:{response:'force'},fx:{tension:1}},{l:'Negotiation',to:'S7',set:{response:'negotiation'},fx:{tension:-1,trust:1}},{l:'Mixed strategy',to:'S7',set:{response:'mixed'}}]},
S7:{p:53,year:'JANUARY 1787',place:'LATE NIGHT IN BOSTON',scene:'charter',badges:['role','sa'],kind:'journal',title:'What Keeps You Up',
 body:"The decision is made, but your mind hasn't settled down. At home, the candle burns low. You think about the widow, Lyman's brother, the lenders, and the people depending on the government to keep order.\n\nWrite as your character. What still bothers you? What do you owe the people whose lives this decision could change?",
 prompt:'Write a diary entry as your character: what keeps you up tonight, and what do you owe the people out west?',next:'S8'},
S8:{p:58,year:'JANUARY 25, 1787',place:'SPRINGFIELD',scene:'arsenal',badges:['doc'],title:'Defend the Arsenal',crisis:1,
 body:"State [[militia]] forces are ready to defend Springfield's federal [[arsenal]]. Some people on opposing sides fought for the same independence. Now they disagree over what that independence should mean.\n\nThe simulation pauses before the confrontation. You're about to leave the fictional decision-making behind and examine the documented event.",
 choices:[{l:'See what actually happened',to:'H1',go:1}]},

/* ---------- CONFEDERATION CONGRESS ---------- */
G1:{p:24,year:'1785',place:'CONGRESS · NEW YORK CITY',scene:'congress',badges:['role','doc'],title:'Congress Asks',
 body:"You represent one state in Congress, and **each state gets one vote**. Congress owes soldiers, lenders, and foreign governments. The [[treasury]] depends heavily on state contributions, but many states send less than requested.\n\nThe bills are real. So are the limits on your authority. What's your first move: request more support, push for reform, or hold off?",
 choices:[{l:'Request state contributions again',to:'G2',set:{strategy:'requisition'}},{l:'Propose changing the system',to:'G2',set:{strategy:'reform'}},{l:'Hold off and hope things improve',to:'G2',set:{strategy:'dismiss'},fx:{trust:-1}}]},
G2:{p:28,year:'1786',place:'CONGRESS · NEW YORK CITY',scene:'charter',badges:['role','so'],title:'A Letter From a Soldier',
 body:"A fictional veteran writes that he served five years, then sold his [[pay certificates|certificate]] cheaply to keep his family fed. Now he's facing debtors' jail.\n\n“I gave years of my life to this country,” he writes. “What do I tell my family now?”\n\nCongress has almost no money. You can write back, but you can't guarantee the payment he needs.",
 choices:[{l:'Write back honestly: Congress can’t pay yet',to:'G2F',set:{letter:'honest'},fx:{trust:1}},{l:'Promise payment you can’t guarantee',to:'G2F',set:{letter:'promise'},fx:{hope:1,trust:-1}},{l:'Set the letter aside',to:'G2F',set:{letter:'ignore'},fx:{hope:-1}}]},
G2F:{p:31,year:'1786',place:'CONGRESS · NEW YORK CITY',scene:'charter',badges:['role','sa'],kind:'feel',title:'Holding His Letter',
 body:"You can debate national finances all day. This letter makes those numbers personal. Someone who served the country is asking what its promises are worth.\n\nWhat does your character feel while reading it? There's no graded answer. Notice the feeling, then consider what you can honestly promise—and what your government has the power to deliver.",
 prompt:'Holding his letter, what does your character feel?',next:'G3'},
G3:{p:35,year:'1786',place:'CONGRESS · NEW YORK CITY',scene:'congress',badges:['role','doc'],title:'Just Tax Them?',src:['art8','art13'],
 body:"A delegate has an idea: “Why don't we collect a national tax and pay the soldiers?” It sounds straightforward. The legal problem isn't.\n\nThe Articles give Congress **no independent general taxing power**. Shared expenses depend on states, and an amendment needs every state [[legislature]] to agree: [[unanimous]] approval. Which move is actually available to you?",
 choices:[{l:'Pass a national tax anyway',to:'D-G3',set:{direct_tax:true},retry:1},{l:'Seek an amendment',to:'G4',card:'unanimity'},{l:'Keep requesting money from the states',to:'G4'}]},
'D-G3':{p:35,year:'1786',place:'CONSTITUTIONAL CHECK',scene:'stop',kind:'deadend',label:'CONSTITUTIONAL DEAD END',title:'A Vote Isn’t a Power',card:'unanimity',
 body:"Passing a bill doesn't magically give Congress the power behind it. Under the Articles, common expenses are funded **through the states**. Changing that arrangement requires **every state legislature** to approve an amendment.\n\nYou've hit the gap between wanting a policy and having the authority to carry it out. Go back and choose a move the Articles permit.",
 choices:[{l:'Return and choose a real option',to:'G3',go:1}]},
G4:{p:39,year:'SEPTEMBER 1786',place:'ANNAPOLIS, MARYLAND',scene:'congress',badges:['role','doc'],title:'Reform Before Rebellion',
 body:"The states are clashing over trade too. Congress lacks the broad interstate commerce power the Constitution will later grant. Delegates meet at **Annapolis** and call for a wider [[convention]].\n\nCheck the date: **September 1786**. Efforts to reform the Confederation are already underway before the Springfield confrontation. The rebellion won't start this debate from scratch.",
 choices:[{l:'Support a broader convention',to:'G5',set:{reform:true}},{l:'Wait and see',to:'G5'},{l:'Oppose expanding national power',to:'G5',set:{reform:false}}]},
G5:{p:43,year:'FALL 1786',place:'CONGRESS · NEW YORK CITY',scene:'congress',badges:['role','rs'],title:'The Delegate Who Disagrees',
 body:"A fictional Rhode Island delegate challenges your reform proposal. His state rejected a national import-tax plan in 1782. “We fought a distant government that taxed us,” he says. “Why build another one?”\n\nYou're focused on unpaid bills. He's focused on protecting state authority. You disagree, but his concern isn't random. How do you keep this conversation moving?",
 choices:[{l:'Ask what protections his state needs',to:'G6',set:{talk:'listen'},fx:{trust:1,tension:-1}},{l:'Tell him his state is blocking everyone else',to:'G6',set:{talk:'argue'},fx:{tension:1}},{l:'Drop it and move on',to:'G6',set:{talk:'walk'}}]},
G6:{p:47,year:'WINTER 1786',place:'CONGRESS · NEW YORK CITY',scene:'congress',badges:['role','doc','dm'],kind:'values',title:'Stop. Think. Choose.',
 body:s=>talkEcho.congress[s.flags.talk]+"Reports describe closed courts and armed resistance in Massachusetts. Congress authorizes new troops, officially for the western frontier, but funding still depends heavily on states. Few soldiers are raised.\n\nThere's a difference between **authorizing action and having the resources to follow through**. Before you choose a response, select two values your character wants to keep in view.",next:'G7'},
G7:{p:51,year:'WINTER 1786',place:'CONGRESS · NEW YORK CITY',scene:'congress',badges:['role','sim'],title:'What Do You Push For?',
 body:s=>valEcho(s)+"Congress can debate, request support, and coordinate. But a vote doesn't produce money or troops when the necessary resources don't arrive.\n\nWhat do you push for now: state support, structural reform, or leaving the dispute primarily to Massachusetts? Your choice sets your character's strategy. It doesn't give Congress powers the Articles haven't granted.",
 choices:[{l:'Ask the states for support',to:'G8',set:{push:'states'},fx:{trust:1}},{l:'Push harder for structural reform',to:'G8',set:{push:'reform'}},{l:'Leave it primarily to Massachusetts',to:'G8',set:{push:'none'},fx:{trust:-1}}]},
G8:{p:55,year:'JANUARY 1787',place:'YOUR BOARDING HOUSE',scene:'charter',badges:['role','sa'],kind:'journal',title:'Writing Back',
 body:"The veteran's letter is still on your desk. Earlier, you chose how to respond. Now you have a clearer picture of Congress's limits.\n\nWrite back as your character. Be direct about what you can do, what you can't promise, and what you think needs to change. He deserves more than “we're working on it.”",
 prompt:'Write 2–4 sentences back to the soldier. What can you honestly tell him?',next:'G9'},
G9:{p:58,year:'JANUARY 1787',place:'CONGRESS · NEW YORK CITY',scene:'arsenal',badges:['doc'],title:'Springfield News',crisis:1,
 body:"News reaches Congress: Regulators are approaching Springfield's federal [[arsenal]]. Unpaid veterans, Massachusetts grievances, and concerns about national capacity are now part of the same political conversation—but they aren't all the same problem.\n\nYour path joins the farmer's and state leader's paths here. The next screens separate immediate causes, documented events, and the arguments people made afterward.",
 choices:[{l:'See what actually happened',to:'H1',go:1}]},

/* ---------- HISTORY CONVERGENCE ---------- */
H1:{p:62,year:'1786–1787',place:'HISTORY CHECK',scene:'check',badges:['doc'],kind:'cfu',check:1,title:'What Actually Caused It?',card:'jurisdiction',
 body:"Don't pin the whole rebellion on “weak Articles.” The immediate causes were in **Massachusetts**: heavy taxes, [[debt]], court costs, scarce coin, and postwar hardship.\n\nThe Articles matter to the national context and the response. Keep both connections straight:\n**Massachusetts grievances → rebellion.**\n**Confederation weaknesses + rebellion → stronger arguments for national reform.**\nSame crisis. Different causal questions.",
 cfu:{key:'h1',pts:1,q:'Which explanation is strongest?',next:'H2',opts:[
  {l:'The Articles directly created the Massachusetts tax crisis.',fb:'Massachusetts, not Congress, set those taxes. The Articles shaped the national context, not the state tax bill.'},
  {l:'Massachusetts grievances drove the rebellion; Confederation weaknesses shaped why it mattered nationally.',ok:1,fb:'Exactly. Two different causal questions, two different answers.'},
  {l:'Britain secretly ordered the rebellion.',fb:'No evidence supports this. The grievances were local: taxes, debt, courts and scarce coin.'}]}},
H2:{p:65,year:'JANUARY 25, 1787',place:'SPRINGFIELD ARSENAL',scene:'arsenal',badges:['doc'],check:1,title:'Springfield',card:'springfield',
 body:"At Springfield, Shays and other Regulators advance toward the arsenal. Massachusetts militia under **General William Shepard** fires warning shots, then cannon loaded with grapeshot.\n\n**Four Regulators are killed**, and about twenty are wounded. The attack collapses. Some people on both sides are veterans or neighbors. These losses are documented history, not a game outcome. Take a moment before continuing.",
 choices:[{l:'Continue',to:'H2F'}]},
H2F:{p:68,year:'JANUARY 1787',place:'AFTER SPRINGFIELD',scene:'arsenal',badges:['sa'],kind:'feel',title:'How Does It Land?',
 body:"That wasn't just a turning point on a timeline. People died, and others had to live with what happened.\n\nYou might feel upset, conflicted, angry, or something else. You might still be processing it. Name a feeling if you can, then keep examining the evidence. A reaction can be a starting point for inquiry, not the end of it.",
 prompt:'Knowing how Springfield ended, what do you feel?',next:'H2B'},
H2B:{p:71,year:'1786–1787',place:'FACES OF THE REBELLION',scene:'portraits',badges:['doc','so'],kind:'cfu',needSrc:['sash'],needPeople:1,people:['sash','hall'],title:'Same Crisis, Different Choices',
 body:"**Moses Sash**, a Black veteran and farmer from Worthington, joins the Regulators and is later indicted as one of their leaders. **Prince Hall**, a Black community leader in Boston, offers volunteers to defend the state.\n\nShared identity doesn't mean a shared position. Open both character files and Sash's indictment. What shaped their different responses, and whose perspective does the court record capture?",
 cfu:{key:'h2b',pts:0,q:'What does their story show?',next:'H2C',opts:[
  {l:'All Black residents of Massachusetts took the same side.',fb:'Sash and Hall chose opposite sides. Communities are not a single opinion.'},
  {l:'People in the same community can make different choices about the same crisis, for real reasons.',ok:1,fb:'Yes. Sash was a struggling hill-town farmer; Hall was a Boston leader seeking full citizenship. Both claimed the Revolution’s promises.'},
  {l:'Only wealthy people cared about Shays’ Rebellion.',fb:'Sash was a farmer and laborer. The rebellion reached ordinary people across the state.'}]}},
H2C:{p:74,year:'FEBRUARY 4, 1787',place:'PETERSHAM, MASSACHUSETTS',scene:'snow',badges:['doc'],kind:'cfu',check:1,people:['lincoln'],title:'After the Snow',card:'merchants',
 body:"Massachusetts organizes a force led by **General Benjamin Lincoln**, financed through private loans from Boston merchants. On February 4, 1787, Lincoln surprises the Regulators at Petersham after a night march through a snowstorm. They scatter; Shays escapes north.\n\nThousands later seek [[amnesty]]. Most death sentences are pardoned, but John Bly and Charles Rose are hanged in December. Defeat doesn't mean everyone gets the same ending.",
 cfu:{key:'after',pts:1,q:'Who paid for the army that ended the rebellion?',next:'H2D',opts:[
  {l:'The Confederation Congress',fb:'Congress had almost no money. That’s exactly the weakness reformers pointed to.'},
  {l:'Loans from more than 125 Boston merchants',ok:1,fb:'Right. Private lenders paid for the state’s army, and Congress sent no money. Notice who had money, and who owed it.'},
  {l:'The British government',fb:'Britain had no role. The money came from wealthy Bostonians.'}]}},
H2D:{p:77,year:'1787–1825',place:'WHAT HAPPENED TO SHAYS',scene:'grave',badges:['doc','so'],title:'What Happened to Daniel Shays?',card:'voters',people:['shays'],
 body:"Shays flees, is sentenced to death, and is **pardoned in 1788**. He later receives a military pension and dies in New York in 1825.\n\nBack in Massachusetts, voters replace Governor Bowdoin with **John Hancock**. Tax and debt policies become less strict. The Regulators lose militarily, but their grievances don't disappear from politics. What can change at the ballot box after a rebellion is defeated?",
 think:'Historians suspect Shays’s role was exaggerated by powerful critics. Why might leaders put one man’s name on a movement of thousands? And what does it mean that voters changed the policy after the rebels lost?',
 choices:[{l:'Hear how leaders reacted',to:'H3',go:1}]},
H3:{p:81,year:'1786–1787',place:'SOURCE LENS',scene:'letters',badges:['int','doc'],kind:'cfu',needSrc:['knox','jefferson'],people:['knox','jefferson'],title:'Two Leaders, Two Reactions',
 body:"Same rebellion, very different reactions. **Henry Knox** sees a serious threat and warns George Washington. **Thomas Jefferson**, writing from France, is less alarmed.\n\nRead both letters before answering. You're identifying their views, not picking the founder you like better. What does each writer fear? What might his position—and his distance from the crisis—help him notice or overlook?",
 cfu:{key:'h3',pts:1,q:'Who treats the rebellion as stronger evidence that government is in danger?',next:'H4',opts:[
  {l:'Henry Knox',ok:1,fb:'Yes. Knox reads the uprising as proof of weak government and a threat to property. That’s his interpretation, shaped by where he stood.'},
  {l:'Thomas Jefferson',fb:'Check his words again. Jefferson is less alarmed and calls “a little rebellion now and then” a good thing.'},
  {l:'Both were equally alarmed',fb:'Compare their tone. Knox sounds an alarm; Jefferson is more tolerant of rebellion. They are interpreting the crisis differently.'}]}},
H4:{p:85,year:'1786',place:'HISTORY CHECK',scene:'check',badges:['doc'],kind:'cfu',check:1,src:['jay'],title:'Shays Was Not the Beginning',card:'timeline',
 body:"The dates matter. **John Jay writes in March 1786** about growing support for a convention. **Annapolis meets in September 1786**. Both come before the January 1787 Springfield confrontation.\n\nShays' Rebellion adds urgency and gives advocates of stronger government a powerful example. It helps intensify an existing debate; it doesn't invent constitutional reform overnight.",
 cfu:{key:'h4',pts:1,q:'Shays’ Rebellion is best described as…',next:'H5',opts:[
  {l:'The sole cause of the movement for a new constitution.',fb:'Check the dates. Jay’s letter and Annapolis came first.'},
  {l:'An accelerator and evidence within a reform movement already underway.',ok:1,fb:'Right. It added urgency and ammunition to an existing argument.'},
  {l:'Unrelated to the debate over the Articles.',fb:'Leaders like Knox and Washington used it as evidence. It mattered.'}]}},
H5:{p:89,year:'MAY–SEPT. 1787',place:'PHILADELPHIA',scene:'philly',badges:['doc'],kind:'sort',check:1,src:['const'],title:'What Changes?',card:'article1',
 body:"Delegates arrive in Philadelphia to address problems in the Confederation. They go beyond small repairs and debate a new structure.\n\nSort the statements: **Articles or Constitution?** Look at who holds each power and how decisions get made. Congress already has important war-related powers under the Articles. The Constitution changes national authority and capacity; it doesn't create government out of nothing."},
H6:{p:93,year:'1787',place:'FINAL CHALLENGE',scene:'check',badges:['doc'],kind:'chain',title:'Final Causal Challenge',
 body:"Time to connect the evidence. Build a causal chain **without saying “The Articles caused Shays' Rebellion.”**\n\nStart with Massachusetts grievances. Explain the Confederation's structural limits. Then show how the rebellion affects a reform debate that's already happening. Your reasoning earns mastery—not your decision to protest, negotiate, use force, or step back. If a link doesn't hold up, revise it."},
'D-H6':{p:93,year:'1787',place:'CAUSALITY CHECK',scene:'stop',kind:'deadend',label:'CAUSALITY CHECK',title:'Rebuild the Chain',
 body:"A one-cause explanation skips too much. Let's rebuild it.\n\n**First:** Massachusetts taxes, debt, court costs, and hardship help drive resistance. **Next:** Confederation limits shape national capacity and concern. **Then:** the rebellion strengthens arguments for reform that already exist.\n\nHead back and connect all three parts. A correction isn't a penalty; it's a chance to make your explanation stronger.",
 choices:[{l:'Return to the final challenge',to:'H6',go:1}]},
H7:{p:96,year:'1787',place:'A CONTESTED NEW DIRECTION',scene:'philly',badges:['doc','int'],title:'The Argument Isn’t Over',
 body:"The Articles were built by people who feared concentrated power. They gave Congress real responsibilities and produced important achievements, but also made national funding and cooperation difficult.\n\nShays' Rebellion makes those limits feel urgent to many leaders. Others worry about handing more power to a national government. **The Constitution is a contested response, not an automatic happy ending.** The argument is still open.",
 choices:[{l:'One last reflection',to:'H8',go:1}]},
H8:{p:98,year:'TODAY',place:'YOUR TURN',scene:'title',badges:['sa','dm'],kind:'journal',private:1,title:'Connect It to Now',
 body:"You've seen petitions, protests, armed resistance, public service, and elections. Different people faced the same crisis and chose different ways to respond.\n\nNow make a connection to today—or use an example from fiction. You don't have to share anything personal. This reflection **stays out of your copied report unless you choose to include it**, and you can skip it.",
 prompt:'Think of a time a rule or system felt unfair, to you, someone you know, or a character from a book or show. What did people do about it? What worked, and what didn’t?',next:'END'}
};

function renderNode(st,n){
  const scr=el('section','screen');
  const art=el('div','art');
  art.innerHTML=`<div class="frame"><canvas role="img" aria-label="Pixel art scene: ${esc(n.place||'')}"></canvas><div class="toast"></div></div><div class="cap"><span class="yr">${esc(n.year||'')}</span><span class="pl">${esc(n.place||'')}</span></div>`;
  scr.appendChild(art);
  toastBox=$('.toast',art);
  const p=el('article','panel');
  if(n.kind==='deadend')p.appendChild(el('div','banner hz',`<span class="t">⚠ ${esc(n.label)}</span><span class="s">Historically impossible move. No game over, just a correction.</span>`));
  else if(n.check)p.appendChild(el('div','banner',`<span class="t">★ HISTORY CHECK</span><span class="s">Your choices pause here. This really happened.</span>`));
  if(n.badges)p.appendChild(el('div','badges',n.badges.map(b=>`<span class="badge ${BADGE[b][0]}">${BADGE[b][1]}</span>`).join('')));
  const h=el('h2','',esc(n.title));h.tabIndex=-1;p.appendChild(h);
  const bodyTxt=typeof n.body==='function'?n.body(S):n.body;
  p.appendChild(el('div','body',fmt(bodyTxt)));
  if(n.think)p.appendChild(el('div','think',`<b>THINK ABOUT IT</b>${esc(n.think)}`));

  const tools=el('div','tools');
  (n.people||[]).forEach(k=>{const b=el('button','chip'+(S.opened['p_'+k]?' done':''));b.type='button';b.textContent='FILE: '+PEOPLE[k].nm.toUpperCase();b.onclick=()=>openPerson(k,()=>render());tools.appendChild(b)});
  (n.src||[]).concat(n.needSrc||[]).forEach(k=>{const b=el('button','chip src'+(S.opened[k]?' done':''));b.type='button';b.textContent='SOURCE: '+SRC[k].btn;b.onclick=()=>openSource(k,()=>render());tools.appendChild(b)});
  const rd=el('button','chip','READ TO ME');rd.type='button';
  rd.onclick=()=>{try{speechSynthesis.cancel();const tmp=document.createElement('div');tmp.innerHTML=fmt(bodyTxt);const u=new SpeechSynthesisUtterance(n.title+'. '+tmp.textContent+(n.prompt?' '+n.prompt:''));u.rate=.95;speechSynthesis.speak(u)}catch(e){rd.textContent='READ-ALOUD UNAVAILABLE'}};
  tools.appendChild(rd);
  const pause=el('button','chip','PAUSE READING');pause.type='button';
  const stop=el('button','chip','STOP READING');stop.type='button';
  pause.onclick=()=>{if(!('speechSynthesis' in window))return;if(speechSynthesis.paused){speechSynthesis.resume();pause.textContent='PAUSE READING'}else{speechSynthesis.pause();pause.textContent='RESUME READING'}};
  stop.onclick=()=>{if('speechSynthesis' in window)speechSynthesis.cancel();pause.textContent='PAUSE READING'};
  if(!('speechSynthesis' in window)){rd.disabled=true;pause.disabled=true;stop.disabled=true;rd.textContent='READ-ALOUD UNAVAILABLE'}
  tools.appendChild(pause);tools.appendChild(stop);
  p.appendChild(tools);

  const area=el('div','');area.style.display='flex';area.style.flexDirection='column';area.style.gap='14px';
  p.appendChild(area);
  ({cfu:renderCfu,sort:renderSort,chain:renderChain,feel:renderFeel,values:renderValues,journal:renderJournal}[n.kind]||((a,n)=>renderChoices(a,n.choices,n)))(area,n);
  scr.appendChild(p);
  st.appendChild(scr);
  st.appendChild(timeline(n.p,n.year));
  mountArt($('canvas',art),n.scene);
  if(n.people&&n.people[0]==='shays'&&S.node==='P0')setTimeout(()=>meet('shays'),300);
  h.focus({preventScroll:true});
}

function renderChoices(area,choices,n){
  const box=el('div','choices');
  choices.forEach((c,i)=>{
    const b=el('button','choice'+(c.go?' go':''),`<span class="k">${choices.length>1?String.fromCharCode(65+i):'▶'}</span><span>${esc(c.l)}</span>`);
    b.type='button';b.dataset.i=i+1;
    b.onclick=()=>{
      beep(c.retry?'bad':'click');
      if(c.set)Object.assign(S.flags,c.set);
      if(c.card)unlock(c.card);
      if(c.retry)S.retries++;
      applyFx(c.fx);renderHud();
      box.querySelectorAll('button').forEach(x=>x.disabled=true);
      setTimeout(()=>go(c.to),c.fx?650:0);
    };
    box.appendChild(b);
  });
  area.appendChild(box);
}
const nextBtn=(wrap,to,label,n)=>{wrap.innerHTML='';renderChoices(wrap,[{l:label||'Continue',to,go:1}],n)};

function renderCfu(area,n){
  const q=n.cfu;
  const need=(n.needSrc||[]).concat(n.needPeople?n.people.map(k=>'p_'+k):[]);
  const missing=need.filter(k=>!S.opened[k]);
  if(missing.length){area.appendChild(el('p','fb',`<b>OPEN EVERYTHING ABOVE</b>Read ${missing.length===1?'the last item':'all '+missing.length+' items'} above to unlock the question.`));return}
  area.appendChild(el('p','q',esc(q.q)));
  const box=el('div','choices');const fb=el('div','');
  const solved=S.flags['solved_'+q.key];
  q.opts.forEach((o,i)=>{
    const b=el('button','choice',`<span class="k">${String.fromCharCode(65+i)}</span><span>${esc(o.l)}</span>`);b.type='button';b.dataset.i=i+1;
    if(solved){b.disabled=true;if(o.ok)b.classList.add('right')}
    b.onclick=()=>{
      const first=S.first[q.key]===undefined;
      if(first)S.first[q.key]=!!o.ok;
      const earned=o.ok&&q.pts?Math.max(0,q.pts-(S.score[q.key]||0)):0;
      if(o.ok&&q.pts)S.score[q.key]=q.pts;
      if(!o.ok){S.retries++;beep('bad');b.classList.add('wrong');
        if(o.to){save();setTimeout(()=>go(o.to),250);return}
        b.disabled=true;fb.innerHTML=`<div class="fb no"><b>NOT QUITE · TRY AGAIN</b>${inline(o.fb)}</div>`;save();renderHud();return}
      beep('good');S.flags['solved_'+q.key]=1;if(q.card)unlock(q.card);if(n.card)unlock(n.card);
      box.querySelectorAll('.choice').forEach(x=>x.disabled=true);b.classList.add('right');
      const pts=earned?` · +${earned} MASTERY`:'';
      fb.innerHTML=`<div class="fb ok"><b>${q.pts?'CORRECT':'YES'}${pts}</b>${inline(o.fb)}</div>`;
      save();renderHud();if(pts)toast('+'+earned+' MASTERY');
      nextBtn(nextWrap,q.next,null,n);
    };
    box.appendChild(b);
  });
  area.appendChild(box);area.appendChild(fb);
  const nextWrap=el('div','');area.appendChild(nextWrap);
  if(solved){const o=q.opts.find(x=>x.ok);fb.innerHTML=`<div class="fb ok"><b>CORRECT</b>${inline(o.fb)}</div>`;nextBtn(nextWrap,q.next,null,n)}
}

function renderFeel(area,n){
  area.appendChild(el('p','q',esc(n.prompt)));
  const grid=el('div','feelgrid');grid.setAttribute('role','group');grid.setAttribute('aria-label','Choose a feeling');
  const out=el('div','');const nextWrap=el('div','');
  const show=k=>{const f=FEELS.find(x=>x[0]===k);out.innerHTML=`<div class="under"><b>UNDER THE FEELING · ${f[1]}</b>${esc(f[3])}<br><span class="note">There’s no wrong answer. Feelings checks are never graded.</span></div>`;nextBtn(nextWrap,n.next,null,n)};
  FEELS.forEach(([k,lab,col],i)=>{
    const b=el('button','ftile',`<canvas aria-hidden="true"></canvas>${lab}`);b.type='button';b.setAttribute('aria-pressed',S.feel[S.node]===k);
    face($('canvas',b),k,col);
    b.onclick=()=>{beep('soft');S.feel[S.node]=k;save();grid.querySelectorAll('.ftile').forEach(x=>x.setAttribute('aria-pressed',x===b));show(k)};
    grid.appendChild(b);
  });
  area.appendChild(grid);area.appendChild(out);area.appendChild(nextWrap);
  if(S.feel[S.node])show(S.feel[S.node]);
}

function renderValues(area,n){
  const pick=(S.values[S.node]||[]).slice();
  area.appendChild(el('p','q','Pick exactly two.'));
  const grid=el('div','valgrid');grid.setAttribute('role','group');grid.setAttribute('aria-label','Choose two values');
  const nextWrap=el('div','');
  const sync=()=>{grid.querySelectorAll('.vtile').forEach(b=>{const on=pick.includes(b.dataset.v);b.setAttribute('aria-pressed',on);b.disabled=!on&&pick.length>=2});
    if(pick.length===2){S.values[S.node]=pick.slice();S.lastValues=pick.slice();save();nextWrap.innerHTML='';nextWrap.appendChild(el('div','under',`<b>VALUES LOCKED</b>Your character stands for <strong>${esc(pick[0])}</strong> and <strong>${esc(pick[1])}</strong>. Watch whether your next choice matches.`));const w=el('div','');nextWrap.appendChild(w);renderChoices(w,[{l:'Make the decision',to:n.next,go:1}],n)}else nextWrap.innerHTML=''};
  VALUES.forEach(v=>{const b=el('button','vtile',esc(v));b.type='button';b.dataset.v=v;b.onclick=()=>{beep('click');const i=pick.indexOf(v);if(i>=0)pick.splice(i,1);else if(pick.length<2)pick.push(v);sync()};grid.appendChild(b)});
  area.appendChild(grid);area.appendChild(nextWrap);sync();
}

function renderJournal(area,n){
  const j=S.journal[S.node]||{text:'',include:!n.private};
  area.appendChild(el('p','q',esc(n.prompt)));
  const ta=el('textarea','jr');ta.id='jr_'+S.node;ta.value=j.text;ta.setAttribute('aria-label',n.prompt);
  area.appendChild(ta);
  let cb=null;
  if(n.private){const l=el('label','chk',`<input type="checkbox" id="inc_${S.node}" ${j.include?'checked':''}> Include this in my mission report`);area.appendChild(l);cb=$('input',l)}
  const upd=()=>{S.journal[S.node]={text:ta.value,include:cb?cb.checked:true,prompt:n.prompt,title:n.title};save()};
  ta.oninput=upd;if(cb)cb.onchange=upd;
  const row=el('div','choices');
  const sv=el('button','choice go','<span class="k">✎</span><span>Save &amp; continue</span>');sv.type='button';sv.dataset.i=1;
  sv.onclick=()=>{upd();beep('good');if(ta.value.trim())toast('JOURNAL SAVED');setTimeout(()=>go(n.next),ta.value.trim()?500:0)};
  const sk=el('button','choice','<span class="k">→</span><span>Skip for now</span>');sk.type='button';sk.dataset.i=2;
  sk.onclick=()=>{beep('click');go(n.next)};
  row.appendChild(sv);row.appendChild(sk);area.appendChild(row);
  area.appendChild(el('p','note',n.private?'Left out of your copied report by default. Saved in this browser; check the box only if you want to share it.':'Writing as your character. This goes in your mission report.'));
}

function renderSort(area,n){
  const done=!!S.flags.solved_h5;
  const sel=S.sort;
  const list=el('div','');list.style.display='flex';list.style.flexDirection='column';list.style.gap='8px';
  const chk=el('button','choice go','<span class="k">✓</span><span>Check my sort</span>');chk.type='button';
  SORT.forEach((c,i)=>{
    const row=el('div','sortrow');
    const res=done?(sel[i]===c.a?'right':'wrong'):'';if(res)row.classList.add(res);
    row.innerHTML=`<div class="txt">${esc(c.t)}${done?`<span class="mark">${res==='right'?'✓ CORRECT':'✗ BELONGS TO '+(c.a==='A'?'ARTICLES':'CONSTITUTION')}</span>`:''}</div><div class="seg2" role="group" aria-label="Sort: ${esc(c.t)}"><button type="button" data-v="A" aria-pressed="${sel[i]==='A'}">ARTICLES</button><button type="button" data-v="C" aria-pressed="${sel[i]==='C'}">CONSTITUTION</button></div>`;
    row.querySelectorAll('button').forEach(b=>{b.disabled=done;b.onclick=()=>{beep('click');sel[i]=b.dataset.v;save();row.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));chk.disabled=Object.keys(sel).length<SORT.length}});
    list.appendChild(row);
  });
  area.appendChild(list);
  chk.disabled=Object.keys(sel).length<SORT.length;
  chk.onclick=()=>{
    const right=SORT.filter((c,i)=>sel[i]===c.a).length;
    S.first.h5=right;S.score.h5=Math.max(S.score.h5||0,right===6?2:right>=4?1:0);S.flags.sortRight=right;S.flags.sortAttempted=true;S.flags.solved_h5=right===6;if(right<6)S.retries++;
    beep(right>=4?'good':'bad');unlock('article1');save();render();if(S.score.h5)toast('+'+S.score.h5+' MASTERY');
  };
  if(!done){area.appendChild(chk);if(S.flags.sortAttempted)area.appendChild(el('div','fb no',`<b>${S.flags.sortRight}/6 MATCHED · TRY AGAIN</b>Check Articles V, VIII, and XIII for state voting, contributions, and amendments. Article I, Section 8 gives the Constitution’s tax, commerce, and militia powers. You can still earn full mastery.`));}
  else{
    const r=S.flags.sortRight;
    area.appendChild(el('div','fb '+(r>=4?'ok':'no'),`<b>${r}/6 SORTED CORRECTLY · +${S.score.h5||0} MASTERY</b>Under the Articles, the treasury relied on states, and Congress already held important war powers. The Constitution explicitly grants broader tax, commerce, army, and militia powers. Think about the unpaid soldiers: which power answers their problem?`));
    const w=el('div','');area.appendChild(w);renderChoices(w,[{l:'Final challenge',to:'H6',go:1}],n);
  }
}

function renderChain(area,n){
  const pick=S.chain;
  const lock=el('button','choice go','<span class="k">★</span><span>Lock in my causal chain</span>');lock.type='button';
  CHAIN.forEach((s,si)=>{
    if(si>0)area.appendChild(el('div','arrow','▼'));
    const box=el('div','step');box.innerHTML=`<h3>${s.h}</h3><p>${esc(s.q)}</p>`;
    s.o.forEach(([t],oi)=>{const b=el('button','opt',`<span class="dot"></span><span>${esc(t)}</span>`);b.type='button';b.setAttribute('aria-pressed',pick[si]===oi);
      b.onclick=()=>{beep('click');pick[si]=oi;save();box.querySelectorAll('.opt').forEach((x,xi)=>x.setAttribute('aria-pressed',xi===oi));lock.disabled=CHAIN.some((_,k)=>pick[k]===undefined||pick[k]===null)};box.appendChild(b)});
    area.appendChild(box);
  });
  lock.disabled=CHAIN.some((_,k)=>pick[k]===undefined||pick[k]===null);
  lock.onclick=()=>{
    const right=CHAIN.filter((s,k)=>s.o[pick[k]][1]).length;
    if(S.first.h6===undefined)S.first.h6=right;S.score.h6=Math.max(S.score.h6||0,right);
    if(right===3){beep('fanfare');save();go('H7')}
    else{beep('bad');S.retries++;S.chain=[];save();go('D-H6')}
  };
  area.appendChild(lock);
  area.appendChild(el('p','note','A weak link gets feedback and a chance to rebuild. Retries can earn full mastery.'));
}

/* =========================================================
   END REPORT
   ========================================================= */
function rankOf(s){return s>=9?'MASTER HISTORIAN':s>=6?'SHARP INVESTIGATOR':s>=3?'APPRENTICE ARCHIVIST':'NEW RECRUIT'}
function pathEcho(){
  const f=S.flags;
  if(S.role==='farmer'){
    const a={armed:'You marched with the armed men toward Springfield.',nonviolent:'You refused to take up arms but kept demanding reform.',withdraw:'You stepped away for your family before Springfield.'}[f.final]||'You lived through the crisis as a hill-town farmer.';
    const b={listen:' You listened to Asa even though you disagreed.',argue:' You and Asa ended up on opposite sides.',walk:' You walked away from Asa.'}[f.talk]||'';
    return a+b+' None of that changed what happened at Springfield, but it changed how you lived the crisis.';
  }
  if(S.role==='state'){
    const a={force:'You leaned on armed force to restore order.',negotiation:'You leaned on negotiation and concessions.',mixed:'You prepared force while keeping talks open.'}[f.response]||'You governed through the crisis.';
    const b={relief:' You pushed for relief for the widow and families like hers.',strict:' You kept the tax program in place despite the widow’s petition.',mixed:' You offered the widow time, but no tax cut.'}[f.petition]||'';
    return a+b+' You saw that this was a state crisis, handled by a state government, with real people on every side.';
  }
  const a=f.reform===true?'You backed a broader convention before Springfield. Americans were already debating reform before Shays became a national symbol.':f.reform===false?'You opposed expanding national power. Many Americans agreed, and kept making that case in 1787–88.':'You waited to see how reform would unfold.';
  const b={honest:' You told the soldier the hard truth.',promise:' You promised the soldier money Congress didn’t have.',ignore:' You set the soldier’s letter aside.'}[f.letter]||'';
  return a+b+(f.direct_tax?' You tried a national tax and ran into Articles VIII and XIII.':'');
}
const feelList=()=>Object.entries(S.feel).map(([nid,k])=>[N[nid]?N[nid].title:nid,FEELS.find(f=>f[0]===k)]).filter(x=>x[1]);
const journalList=(all)=>Object.entries(S.journal).filter(([,j])=>j.text&&j.text.trim()&&(all||j.include));
function reportText(name){
  const sc=total();
  const fl=feelList().map(([t,f])=>`${t}: ${f[1]}`).join(' → ')||'(none)';
  const vals=S.lastValues?S.lastValues.join(' + '):'(none)';
  const js=journalList(false).map(([,j])=>`${j.title}\n${j.text.trim()}`).join('\n\n')||'(none)';
  return `CAN THE NEW COUNTRY SURVIVE? — MISSION REPORT
Name: ${name||'(not entered)'}
Role: ${ROLE_NAME[S.role]||'—'}
Mastery: ${sc}/10 · ${rankOf(sc)}
${ASSESS.map(([k,l,m])=>`  - ${l}: ${S.score[k]||0}/${m}`).join('\n')}
Corrections visited: ${S.retries}
People met: ${S.people.map(k=>PEOPLE[k].nm).join(', ')||'(none)'}

SEL
Feelings journey: ${fl}
Values I chose: ${vals}
Final meters (simulation only): Hope ${S.m.hope}/5 · Trust ${S.m.trust}/5 · Tension ${S.m.tension}/5
My path: ${pathEcho()}

JOURNAL
${js}

EXIT TICKET — What problem did the Constitution attempt to solve, and what new problem might stronger national power create?
${S.flags.ticket||'(no answer yet)'}`;
}
function renderEnd(st){
  anim=null;toastBox=null;
  const sc=total();
  st.appendChild(el('section','finale',`<div class="y">1787</div>
    <p>The Articles were created by Americans who feared concentrated power. Now many fear something different: a national government too weak to keep its promises to the people who fought for it.</p>
    <p>But giving the national government more power creates a new question.</p>
    <div class="big">How powerful should it become?</div>
    <p style="color:var(--gold);font-family:var(--f-pixel);font-size:11px;line-height:1.8;margin-top:22px">THAT ARGUMENT IS ABOUT TO TAKE OVER PHILADELPHIA.</p>`));
  const rep=el('div','report');
  const left=el('article','panel');
  const fl=feelList();
  left.innerHTML=`<div class="badges"><span class="badge doc">MISSION REPORT</span><span class="badge role">${esc((ROLE_NAME[S.role]||'').toUpperCase())}</span></div>
   <h2 tabindex="-1">Your Results</h2>
   <div><div class="score">${sc}<small>/10</small></div><div class="rank">${rankOf(sc)}</div></div>
   <table class="sc"><tbody>${ASSESS.map(([k,l,m])=>`<tr><td>${esc(l)}</td><td>${S.score[k]||0}/${m}</td></tr>`).join('')}</tbody></table>
   <p class="note">Mastery reflects your best demonstrated understanding. Retries do not lower your score. Corrections visited: ${S.retries}.</p>
   <p class="sech">YOUR FEELINGS JOURNEY</p>
   <div class="journey" id="jy">${fl.length?fl.map(([t,f],i)=>`<span class="jchip"><canvas data-f="${f[0]}" data-c="${f[2]}" aria-hidden="true"></canvas><span><b>${f[1]}</b><br>${esc(t)}</span></span>`).join(''):'<span class="note">No feelings checks recorded.</span>'}</div>
   ${S.lastValues?`<div class="under"><b>WHAT YOU STOOD FOR</b>${esc(S.lastValues.join(' + '))}</div>`:''}
   <div class="fb"><b>YOUR PATH</b>${esc(pathEcho())}</div>
   <p class="note">Meters (simulation only, never graded): Hope ${S.m.hope}/5 · Trust ${S.m.trust}/5 · Tension ${S.m.tension}/5.</p>`;
  const right=el('article','panel');
  right.innerHTML=`<div class="debrief"><p><strong>Debrief: which statement is more accurate, and why?</strong></p>
     <p><strong>A.</strong> “The Articles of Confederation caused Shays’ Rebellion.”</p>
     <p style="margin:0"><strong>B.</strong> “Massachusetts’s economic and political crisis caused the rebellion, while weaknesses in the Confederation shaped its national significance and strengthened an existing reform movement.”</p></div>
   <div class="think"><b>TALK IT OUT</b>Find someone who played a different role. What did each of your characters feel at Springfield, and why might you both be right?</div>
   <label for="nm">YOUR NAME</label><input id="nm" type="text" autocomplete="name" value="${esc(S.flags.name||'')}">
   <label for="tk">EXIT TICKET · What problem did the Constitution attempt to solve, and what new problem might stronger national power create?</label>
   <textarea id="tk">${esc(S.flags.ticket||'')}</textarea>
   <div class="choices"><button class="choice go" type="button" id="cpBtn"><span class="k">⧉</span><span>Copy my report</span></button></div>
   <p class="note">Your report includes your journal entries. Your private reflection is included only if you checked the box.</p>
   <pre class="rep" id="repTxt" hidden></pre>
   <div class="tools"><button class="chip" type="button" id="againBtn">PLAY ANOTHER ROLE</button><button class="chip" type="button" id="resetBtn">RESTART FROM TITLE</button></div>`;
  rep.appendChild(left);rep.appendChild(right);st.appendChild(rep);
  left.querySelectorAll('canvas[data-f]').forEach(cv=>face(cv,cv.dataset.f,cv.dataset.c));
  const nm=$('#nm'),tk=$('#tk');
  const upd=()=>{S.flags.name=nm.value;S.flags.ticket=tk.value;save()};nm.oninput=upd;tk.oninput=upd;
  $('#cpBtn').onclick=e=>{
    upd();const txt=reportText(nm.value);const pre=$('#repTxt');pre.textContent=txt;pre.hidden=false;
    const lab=e.currentTarget.querySelector('span:last-child');
    const sel=()=>{const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);lab.textContent='Selected. Press Ctrl/Cmd+C to copy'};
    try{navigator.clipboard.writeText(txt).then(()=>{lab.textContent='Copied! Paste it where your teacher asks';beep('good')},sel)}catch(err){sel()}
  };
  $('#againBtn').onclick=()=>{const keep={score:S.score.c2?{c2:S.score.c2}:{},first:{c2:S.first.c2},cards:S.cards.filter(c=>['sovereignty','requisition','notpowerless'].includes(c)),people:['shays'],flags:{solved_c2:1},feel:S.feel.P1?{P1:S.feel.P1}:{},seen:{P0:1,P1:1,C0:1,C1:1,C2:1,C3:1}};S=Object.assign(fresh(),keep);go('R0')};
  $('#resetBtn').onclick=()=>{S=fresh();clearSave();render()};
  $('h2',left).focus({preventScroll:true});
}

/* keyboard: 1–4 pick choices */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closePop();
  if(modal.open||/INPUT|TEXTAREA/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-4]$/.test(e.key)){const b=document.querySelector(`#stage [data-i="${e.key}"]:not([disabled])`);if(b){e.preventDefault();b.click()}}
});

/* boot */
function start(data){if(data&&data.node)S=Object.assign(fresh(),data);render()}
start();
</script>
